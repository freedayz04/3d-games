<title>Roadster Survive</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: a phone-shaped game screen on an asphalt backdrop. HUD floats over the 3D road;
   the garage is a bottom sheet under a live 3D car showcase. */
:root {
  --backdrop: #1b2130;
  --ink: #ffffff;
  --ink-dark: #18202f;
  --muted: #c3cee2;
  --panel: rgba(15, 21, 35, 0.78);
  --panel-solid: #172033;
  --line: rgba(255, 255, 255, 0.16);
  --go: #2bd96b;
  --stop: #ff3b4d;
  --cash: #ffc21a;
  --blue: #2e9bff;
  --violet: #8b5cf6;
  --display: "Russo One", "Arial Black", Impact, sans-serif;
  --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: repeating-linear-gradient(90deg, transparent 0 47%, rgba(255,255,255,.05) 47% 53%, transparent 53% 100%), var(--backdrop);
  background-color: var(--backdrop); color: var(--ink); font-family: var(--body);
  display: grid; place-items: center; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box; overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#stage { position: relative; overflow: hidden; border-radius: 22px; background: #9ad8ff; --u: 4px; touch-action: none;
  box-shadow: 0 0 0 3px #39445c, 0 30px 80px rgba(0,0,0,.5); }
canvas#game { display: block; width: 100%; height: 100%; }
svg { display: block; }

/* ---------- HUD ---------- */
.hud { position: absolute; inset: 0 0 auto 0; padding: calc(var(--u)*3) calc(var(--u)*3) 0; pointer-events: none; display: flex; flex-direction: column; gap: calc(var(--u)*1.6); }
.row { display: flex; align-items: center; gap: calc(var(--u)*2); }
.chip { display: inline-flex; align-items: center; gap: calc(var(--u)*1.2); font: calc(var(--u)*3.6)/1 var(--display); padding: calc(var(--u)*1.5) calc(var(--u)*2.4);
  border-radius: 99px; background: var(--panel); border: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip svg { width: calc(var(--u)*4.4); height: calc(var(--u)*4.4); }
.chip.cash { color: var(--cash); }
.chip.power { margin-left: auto; padding: calc(var(--u)*1.2) calc(var(--u)*3) calc(var(--u)*1.2) calc(var(--u)*1.6); background: linear-gradient(180deg, #3aa3ff, #1f6fe0); border-color: rgba(255,255,255,.45); }
.chip.power small { font: 600 calc(var(--u)*2.2)/1 var(--body); letter-spacing: .1em; opacity: .85; }
.chip.power b { font: calc(var(--u)*5.4)/1 var(--display); font-weight: 400; }
.chip.power.bump { animation: bump .35s ease-out; }
@keyframes bump { 40% { transform: scale(1.18); } }
.prog { flex: 1; height: calc(var(--u)*3.2); border-radius: 99px; background: var(--panel); position: relative; border: 2px solid rgba(255,255,255,.25); }
.prog i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit; background: linear-gradient(90deg, #2e9bff, #2bd96b); }
.prog .car { position: absolute; top: 50%; width: calc(var(--u)*3.4); height: calc(var(--u)*3.4); border-radius: 50%; background: #fff; border: 2px solid var(--blue); transform: translate(-50%, -50%); }
.prog .boss { position: absolute; right: calc(var(--u)*-1); top: 50%; transform: translateY(-50%); width: calc(var(--u)*5.4); height: calc(var(--u)*5.4); }
.hearts { display: flex; gap: calc(var(--u)*.6); }
.hearts svg { width: calc(var(--u)*5.2); height: calc(var(--u)*5.2); filter: drop-shadow(0 2px 0 rgba(0,0,0,.25)); }
.effects { display: flex; flex-wrap: wrap; gap: calc(var(--u)*1.2); }
.fx { display: inline-flex; align-items: center; gap: calc(var(--u)*1); font: 800 calc(var(--u)*2.7)/1 var(--body); padding: calc(var(--u)*1.1) calc(var(--u)*1.8) calc(var(--u)*1.1) calc(var(--u)*1.1);
  border-radius: 99px; background: var(--panel); border: 2px solid var(--c, #fff); }
.fx svg { width: calc(var(--u)*3.6); height: calc(var(--u)*3.6); }

.gadgets { position: absolute; right: calc(var(--u)*2.4); top: 30%; display: flex; flex-direction: column; gap: calc(var(--u)*2); z-index: 3; }
.gbtn { position: relative; width: calc(var(--u)*13); height: calc(var(--u)*13); border-radius: calc(var(--u)*3.5); border: 2px solid var(--c); background: var(--panel);
  display: grid; place-items: center; cursor: pointer; padding: 0; box-shadow: 0 calc(var(--u)*1) 0 rgba(0,0,0,.35); }
.gbtn svg { width: 66%; height: 66%; }
.gbtn b { position: absolute; right: calc(var(--u)*-1.2); top: calc(var(--u)*-1.2); min-width: calc(var(--u)*4.6); height: calc(var(--u)*4.6); border-radius: 99px; background: var(--c); color: var(--ink-dark);
  font: calc(var(--u)*2.8)/calc(var(--u)*4.6) var(--display); text-align: center; }
.gbtn:disabled { opacity: .45; cursor: default; }
.gbtn:active:not(:disabled) { transform: translateY(2px); }
.gbtn.passive { cursor: default; width: calc(var(--u)*10); height: calc(var(--u)*10); margin-left: auto; }

.charge { position: absolute; left: 30%; right: 30%; bottom: 5%; height: calc(var(--u)*2.6); border-radius: 99px; background: var(--panel); border: 2px solid rgba(255,255,255,.3); overflow: hidden; }
.charge i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #ff4d8d, #ffd1e4); }
.charge.ready i { background: #fff; }

.tut { position: absolute; left: 0; right: 0; top: 54%; display: flex; flex-direction: column; align-items: center; gap: calc(var(--u)*2.4); pointer-events: none; text-align: center; transition: opacity .4s; }
.tut.off { opacity: 0; }
.tut svg { width: calc(var(--u)*30); height: calc(var(--u)*30); filter: drop-shadow(0 4px 10px rgba(0,0,0,.4)); }
.tut .t { font: calc(var(--u)*5)/1.1 var(--display); text-shadow: 0 3px 0 rgba(0,0,0,.35); }
.tut .s { font: 800 calc(var(--u)*3.2)/1.35 var(--body); padding: calc(var(--u)*1.6) calc(var(--u)*3); border-radius: 99px; background: var(--panel); }
.tut .finger { animation: fing 2.4s ease-in-out infinite; transform-origin: center; }
@keyframes fing { 0%,100% { transform: translate(0,0); } 20% { transform: translate(14px,0); } 40% { transform: translate(-14px,0); } 60% { transform: translate(0,-14px); } 80% { transform: translate(0,14px); } }

.hint { position: absolute; left: calc(var(--u)*5); right: calc(var(--u)*17); top: 22%; text-align: center; font: 800 calc(var(--u)*4)/1.25 var(--body);
  padding: calc(var(--u)*2.2) calc(var(--u)*3); border-radius: calc(var(--u)*3); background: var(--panel); border: 1px solid var(--line); pointer-events: none; opacity: 0; transform: translateY(-8px); transition: opacity .25s, transform .25s; text-wrap: balance; }
.hint.on { opacity: 1; transform: none; }
.hint .g { color: var(--go); } .hint .r { color: var(--stop); } .hint .y { color: var(--cash); } .hint .b { color: #7cc4ff; }
.flash { position: absolute; left: 0; right: 0; top: 38%; text-align: center; font: calc(var(--u)*10.5)/1 var(--display); pointer-events: none; opacity: 0;
  text-shadow: 0 calc(var(--u)*.8) 0 rgba(0,0,0,.35), 0 0 calc(var(--u)*4) rgba(0,0,0,.25); -webkit-text-stroke: 1px rgba(0,0,0,.25); }
.flash.go { animation: flash var(--d, 1.2s) ease-out forwards; }
@keyframes flash { 0% { opacity: 0; transform: scale(1.8); } 12% { opacity: 1; transform: scale(1); } 78% { opacity: 1; } 100% { opacity: 0; transform: translateY(calc(var(--u)*-3)); } }
.redflash { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 calc(var(--u)*14) rgba(255,40,60,.9); opacity: 0; }
.redflash.go { animation: rf .5s ease-out; }
@keyframes rf { 0% { opacity: 1; } 100% { opacity: 0; } }
.speedlines { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s;
  background: repeating-linear-gradient(90deg, transparent 0 9%, rgba(255,255,255,.55) 9% 9.4%, transparent 9.4% 23%, rgba(255,255,255,.35) 23% 23.3%, transparent 23.3% 100%);
  -webkit-mask: radial-gradient(ellipse 45% 55% at 50% 55%, transparent 55%, #000 100%); mask: radial-gradient(ellipse 45% 55% at 50% 55%, transparent 55%, #000 100%); animation: lines .25s linear infinite; }
.speedlines.on { opacity: 1; }
@keyframes lines { to { background-position: 0 calc(var(--u)*30); } }
.edge { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s; box-shadow: inset 0 0 calc(var(--u)*10) var(--c, #38bdf8); }
.edge.on { opacity: .9; }

/* ---------- Panels ---------- */
.panel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u)*3);
  padding: calc(var(--u)*6) calc(var(--u)*5); text-align: center; box-sizing: border-box; }
.panel.dim { background: linear-gradient(rgba(12,18,32,.2), rgba(12,18,32,.88) 60%); }
.logo { font: calc(var(--u)*13)/.92 var(--display); color: var(--cash); text-shadow: 0 calc(var(--u)*1) 0 #c4561a, 0 calc(var(--u)*2) calc(var(--u)*3) rgba(0,0,0,.35); transform: skewX(-8deg); }
.logo span { display: block; color: var(--ink); text-shadow: 0 calc(var(--u)*1) 0 #1d5fbf, 0 calc(var(--u)*2) calc(var(--u)*3) rgba(0,0,0,.35); }
.tag { font: 800 calc(var(--u)*3.6)/1.3 var(--body); }
.tag b { color: var(--go); } .tag i { font-style: normal; color: var(--cash); }
.small { font: 400 calc(var(--u)*3)/1.5 var(--body); color: var(--muted); max-width: 34ch; }
.btn { font: calc(var(--u)*5.4)/1 var(--display); color: var(--ink); background: var(--go); border: 0; border-radius: calc(var(--u)*3.5);
  padding: calc(var(--u)*3.6) calc(var(--u)*9); box-shadow: 0 calc(var(--u)*1.3) 0 #16924a; cursor: pointer; transition: transform .1s, box-shadow .1s; text-shadow: 0 2px 0 rgba(0,0,0,.2); }
.btn:active { transform: translateY(calc(var(--u)*1)); box-shadow: 0 calc(var(--u)*.3) 0 #16924a; }
.btn.alt { background: var(--cash); color: var(--ink-dark); box-shadow: 0 calc(var(--u)*1.3) 0 #b88200; font-size: calc(var(--u)*4); padding: calc(var(--u)*2.8) calc(var(--u)*6); text-shadow: none; }
.btn:disabled { filter: grayscale(.7); opacity: .7; }
button:focus-visible { outline: 3px solid var(--cash); outline-offset: 3px; }
.panel h2 { margin: 0; font: calc(var(--u)*8)/1 var(--display); text-wrap: balance; font-weight: 400; }
.panel h2.win { color: var(--go); } .panel h2.lose { color: var(--stop); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u)*2.4); width: 100%; }
.stats div { background: var(--panel); border: 1px solid var(--line); border-radius: calc(var(--u)*3); padding: calc(var(--u)*3); display: flex; flex-direction: column; gap: calc(var(--u)*1.2); }
.stats b { font: calc(var(--u)*7)/1 var(--display); font-weight: 400; font-variant-numeric: tabular-nums; }
.stats span { font: 600 calc(var(--u)*2.5)/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.stats .c b { color: var(--cash); }
.found { display: flex; gap: calc(var(--u)*1.6); flex-wrap: wrap; justify-content: center; }

/* ---------- Garage / shop ---------- */
.garage { justify-content: flex-start; padding: 0; gap: 0; background: linear-gradient(rgba(12,18,32,.0) 30%, rgba(12,18,32,.25) 45%); }
.ghead { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: calc(var(--u)*3.5) calc(var(--u)*4); box-sizing: border-box; }
.ghead h2 { font: calc(var(--u)*6.4)/1 var(--display); text-shadow: 0 3px 0 rgba(0,0,0,.3); }
.showcase { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: calc(var(--u)*2); pointer-events: none; }
.showcase .nm { font: calc(var(--u)*5)/1 var(--display); text-shadow: 0 3px 0 rgba(0,0,0,.35); }
.showcase .sub { font: 600 calc(var(--u)*2.8)/1.3 var(--body); margin-top: calc(var(--u)*1); padding: calc(var(--u)*1) calc(var(--u)*2.4); border-radius: 99px; background: var(--panel); }
.sheet { width: 100%; height: 56%; background: var(--panel-solid); border-radius: calc(var(--u)*5) calc(var(--u)*5) 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.35);
  display: flex; flex-direction: column; box-sizing: border-box; padding: calc(var(--u)*2.6) calc(var(--u)*3.4) calc(var(--u)*3.4); gap: calc(var(--u)*2.4); }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: calc(var(--u)*1.2); background: rgba(0,0,0,.25); padding: calc(var(--u)*1); border-radius: calc(var(--u)*3); }
.tab { border: 0; background: transparent; color: var(--muted); font: calc(var(--u)*3)/1 var(--display); padding: calc(var(--u)*2.2) 0; border-radius: calc(var(--u)*2.2); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: calc(var(--u)*1); }
.tab svg { width: calc(var(--u)*5.4); height: calc(var(--u)*5.4); opacity: .7; }
.tab[aria-selected="true"] { background: #2a3550; color: var(--ink); }
.tab[aria-selected="true"] svg { opacity: 1; }
.items { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: calc(var(--u)*1.8); padding-right: 2px; scrollbar-width: thin; }
.item { display: grid; grid-template-columns: calc(var(--u)*13) 1fr auto; gap: calc(var(--u)*2.6); align-items: center; padding: calc(var(--u)*2.2); border-radius: calc(var(--u)*3);
  background: #202b43; border: 2px solid transparent; text-align: left; color: var(--ink); font-family: var(--body); cursor: pointer; width: 100%; box-sizing: border-box; }
.item.sel { border-color: var(--blue); background: #22324f; }
.item .ic { width: calc(var(--u)*13); height: calc(var(--u)*13); border-radius: calc(var(--u)*3); background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.18), rgba(255,255,255,.04)); display: grid; place-items: center; }
.item .ic svg { width: 82%; height: 82%; }
.item .mid { min-width: 0; display: flex; flex-direction: column; gap: calc(var(--u)*.9); }
.item .nm { font: calc(var(--u)*3.6)/1.1 var(--display); display: flex; gap: calc(var(--u)*1.4); align-items: baseline; flex-wrap: wrap; }
.item .nm small { font: 600 calc(var(--u)*2.4)/1 var(--body); color: var(--muted); }
.item .ds { font: 400 calc(var(--u)*2.6)/1.3 var(--body); color: var(--muted); }
.bars { display: grid; grid-template-columns: auto 1fr; gap: calc(var(--u)*.6) calc(var(--u)*1.6); align-items: center; font: 600 calc(var(--u)*2.1)/1 var(--body); color: var(--muted); letter-spacing: .06em; margin-top: calc(var(--u)*.4); }
.bars span { display: flex; gap: 2px; }
.bars i { flex: 1; height: calc(var(--u)*1.4); border-radius: 2px; background: rgba(255,255,255,.12); }
.bars i.on { background: var(--c, var(--cash)); }
.pips { display: flex; gap: 2px; margin-top: calc(var(--u)*.4); flex-wrap: wrap; }
.pips i { width: calc(var(--u)*2.2); height: calc(var(--u)*1.4); border-radius: 2px; background: rgba(255,255,255,.12); }
.pips i.on { background: var(--go); }
.buy { font: calc(var(--u)*3.2)/1 var(--display); border: 0; border-radius: calc(var(--u)*2.2); padding: calc(var(--u)*2.2) calc(var(--u)*2.6); background: var(--cash); color: var(--ink-dark);
  box-shadow: 0 calc(var(--u)*.8) 0 #b88200; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: calc(var(--u)*.8); font-variant-numeric: tabular-nums; }
.buy svg { width: calc(var(--u)*3.4); height: calc(var(--u)*3.4); }
.buy.equip { background: var(--blue); color: #fff; box-shadow: 0 calc(var(--u)*.8) 0 #1a5fb8; }
.buy.on { background: transparent; color: var(--go); box-shadow: none; border: 2px solid var(--go); }
.buy:disabled { background: #3a465f; color: #8d9ab3; box-shadow: none; cursor: default; }
.buy.max { background: transparent; color: var(--muted); box-shadow: none; border: 2px solid var(--line); }
.sheet .btn { width: 100%; padding: calc(var(--u)*3.4) 0; }
.foot { display: flex; justify-content: center; }
.linkbtn { background: none; border: 0; color: var(--muted); font: 400 calc(var(--u)*2.4)/1 var(--body); text-decoration: underline; cursor: pointer; padding: calc(var(--u)*.6); }
.err { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ink-dark); font: 400 15px/1.5 var(--body); }

/* ---------- AutoPilot banner ---------- */
.apbar { position: absolute; left: calc(var(--u)*3); right: calc(var(--u)*3); bottom: calc(var(--u)*12); display: flex; align-items: center; gap: calc(var(--u)*2.4);
  padding: calc(var(--u)*2) calc(var(--u)*2.4); border-radius: calc(var(--u)*4); background: linear-gradient(90deg, rgba(76,29,149,.92), rgba(109,40,217,.85)); border: 2px solid #c4b5fd;
  box-shadow: 0 0 calc(var(--u)*6) rgba(167,139,250,.6); z-index: 4; }
.apbar.nudge { animation: nudge .35s; }
@keyframes nudge { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.apwheel { width: calc(var(--u)*11); height: calc(var(--u)*11); flex: none; animation: steerwheel 1.6s ease-in-out infinite; }
.apwheel svg { width: 100%; height: 100%; }
@keyframes steerwheel { 0%,100% { transform: rotate(-35deg); } 50% { transform: rotate(35deg); } }
.aptext { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: calc(var(--u)*.8); }
.aptext b { font: calc(var(--u)*4.4)/1 var(--display); font-weight: 400; letter-spacing: .04em; }
.aptext span { font: 600 calc(var(--u)*2.6)/1.2 var(--body); color: #ddd6fe; }
.aptrack { height: calc(var(--u)*1.6); border-radius: 99px; background: rgba(0,0,0,.35); overflow: hidden; }
.aptrack i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #c4b5fd, #fff); }
.apbar button { flex: none; font: calc(var(--u)*2.8)/1 var(--display); color: #4c1d95; background: #fff; border: 0; border-radius: calc(var(--u)*2.4); padding: calc(var(--u)*2.2) calc(var(--u)*2.4); cursor: pointer; }

/* ---------- 3D thumbnails, slots, toggles ---------- */
.item .ic img, .slot img { width: 100%; height: 100%; object-fit: contain; display: block; }
.gbtn img { width: 92%; height: 92%; object-fit: contain; }
.slotbar { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u)*1.6); padding: calc(var(--u)*2); border-radius: calc(var(--u)*3); background: rgba(0,0,0,.25); }
.slotbar .cap { grid-column: 1 / -1; font: 600 calc(var(--u)*2.4)/1 var(--body); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.slot { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u)*.6); padding: calc(var(--u)*1.2); border-radius: calc(var(--u)*2.4); background: #202b43; border: 2px solid var(--blue); min-width: 0; }
.slot .p { width: calc(var(--u)*12); height: calc(var(--u)*12); }
.slot b { font: calc(var(--u)*2.4)/1.1 var(--display); font-weight: 400; text-align: center; overflow-wrap: anywhere; }
.slot.empty { border-style: dashed; border-color: var(--line); color: var(--muted); justify-content: center; font: 600 calc(var(--u)*2.3)/1.25 var(--body); text-align: center; }
.slot.locked { border-color: transparent; background: rgba(255,255,255,.04); color: #7d8aa5; justify-content: center; font: 600 calc(var(--u)*2.3)/1.25 var(--body); text-align: center; }
.toggles { display: flex; gap: calc(var(--u)*1.6); }
.tg { width: calc(var(--u)*9); height: calc(var(--u)*9); border-radius: 50%; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; cursor: pointer; padding: 0; }
.tg svg { width: 60%; height: 60%; }
.titletg { position: absolute; top: calc(var(--u)*4); right: calc(var(--u)*4); }

/* ---------- v4: icon-first title, garage grid, settings ---------- */
.panel.title { background: linear-gradient(rgba(12,18,32,.55), rgba(12,18,32,0) 30%, rgba(12,18,32,0) 60%, rgba(12,18,32,.75)); justify-content: flex-start; padding-top: calc(var(--u)*12); }
.grow { flex: 1; }
.btn.play { font-size: calc(var(--u)*8); padding: calc(var(--u)*4.4) calc(var(--u)*14); display: inline-flex; align-items: center; gap: calc(var(--u)*2.4); border-radius: calc(var(--u)*5); }
.tri { width: 0; height: 0; border-left: calc(var(--u)*5) solid #fff; border-top: calc(var(--u)*3.2) solid transparent; border-bottom: calc(var(--u)*3.2) solid transparent; }
.trow { display: flex; gap: calc(var(--u)*3); justify-content: center; margin-bottom: calc(var(--u)*6); }
.iconbtn { width: calc(var(--u)*13); height: calc(var(--u)*13); border-radius: calc(var(--u)*3.6); border: 0; background: #fff; box-shadow: 0 calc(var(--u)*1) 0 #9aa3b2; display: grid; place-items: center; cursor: pointer; padding: 0; }

// 3D THUMBNAILS: real models rendered once into images for the shop & HUD
// ======================================================================
const thumbCache = new Map();
let thumbR = null, thumbScene = null, thumbCam = null;
function thumb(key, build) {
  if (thumbCache.has(key)) return thumbCache.get(key);
  if (!thumbR) {
    try {
      thumbR = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      thumbR.setSize(176, 176); thumbR.setPixelRatio(1);
      thumbR.toneMapping = THREE.ACESFilmicToneMapping; thumbR.toneMappingExposure = 1.15;
    } catch { thumbR = false; }
    thumbScene = new THREE.Scene();
    thumbScene.add(new THREE.HemisphereLight('#ffffff', '#5b6b8c', 1.9));
    const key1 = new THREE.DirectionalLight('#fff4e0', 2.4); key1.position.set(4, 6, 5); thumbScene.add(key1);
    const rim = new THREE.DirectionalLight('#9fd3ff', 1.6); rim.position.set(-5, 3, -4); thumbScene.add(rim);
    thumbCam = new THREE.PerspectiveCamera(28, 1, 0.05, 100);
  }
  if (!thumbR) return '';
  const obj = build();
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  obj.position.sub(center);
  const holder = new THREE.Group(); holder.add(obj); holder.rotation.y = -0.65; thumbScene.add(holder);
  const r = size.length() / 2;
  const dist = r / Math.sin(THREE.MathUtils.degToRad(thumbCam.fov / 2)) * 1.02;
  thumbCam.position.set(0, dist * 0.42, dist * 0.91); thumbCam.lookAt(0, 0, 0);
  thumbR.render(thumbScene, thumbCam);
  const url = thumbR.domElement.toDataURL('image/png');
  thumbScene.remove(holder);
  thumbCache.set(key, url);
  return url;
}

function wheels(g, w, l, r, color = '#25272e') {
  const list = [];
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const wh = part(GEO.wheel, color, [r, 0.32, r], [sx * w / 2, r, sz * l * 0.31]);
    wh.rotation.z = Math.PI / 2; g.add(wh); list.push(wh);
    const hub = part(GEO.cyl6, '#c3cad6', [r * 0.45, 0.34, r * 0.45], [sx * w / 2, r, sz * l * 0.31]);
    hub.rotation.z = Math.PI / 2; g.add(hub);
  }
  return list;
}
function lights(g, w, y, zf, zr) {
  for (const s of [-1, 1]) {
    g.add(part(GEO.rbox, '#fff4b0', [0.34, 0.16, 0.06], [s * w * 0.32, y, zf], { emissive: '#ffe066', emissiveIntensity: 0.8 }));

// ---------- Weapon models: used on the car and for shop pictures ----------
// `barrels` = extra in-run guns; they are packed tightly so mounts never sprawl.
function buildWeaponModel(id, barrels = 1) {
  const g = new THREE.Group();
  const n = Math.max(1, Math.min(4, barrels)), sp = 0.24;
  const each = fn => { for (let i = 0; i < n; i++) fn((i - (n - 1) / 2) * sp); };
  const rotX = m => { m.rotation.x = Math.PI / 2; return m; };
  const rot0 = (m, x) => { m.rotation.x = x; return m; };
  switch (id) {
    case 'twin':
      g.add(part(GEO.rbox, '#3b4256', [0.34 + n * 0.12, 0.26, 0.55], [0, 0, 0.15]));
      g.add(part(GEO.rbox, '#ffc21a', [0.2, 0.16, 0.3], [0.3 + n * 0.06, -0.02, 0.25]));
      each(x => { for (const dx of [-0.06, 0.06]) g.add(rotX(part(GEO.wheel, '#9aa3b2', [0.045, 0.85, 0.045], [x + dx, 0.03, -0.45]))); });
      break;
    case 'minigun':
      g.add(part(GEO.rbox, '#3b4256', [0.3 + n * 0.14, 0.3, 0.5], [0, 0, 0.2]));
      g.add(part(GEO.rbox, '#c58a12', [0.14, 0.12, 0.4], [0.24 + n * 0.07, -0.08, 0.3]));
      each(x => {
        g.add(rotX(part(GEO.cyl6, '#59616e', [0.12, 0.12, 0.12], [x, 0.02, -0.1])));
        for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2; g.add(rotX(part(GEO.wheel, '#c3cad6', [0.028, 0.9, 0.028], [x + Math.cos(a) * 0.07, 0.02 + Math.sin(a) * 0.07, -0.55]))); }
        g.add(rotX(part(GEO.cyl6, '#59616e', [0.11, 0.05, 0.11], [x, 0.02, -0.95])));
      });
      break;
    case 'missile':

    case 'bazooka':

const CRATE_REWARDS = ['gun', 'rate', 'cash', 'power', 'g:guard', 'g:emp', 'g:drone', 'g:magnet', 'g:gold', 'g:hammer', 'g:autopilot'];
function buildEvents(level, length) {
  const ev = [];
  let d;
  if (level === 1) {
    ev.push({ d: 45,  type: 'cars', cars: [{ x: 0, p: 8 }], hint: 'Ram <span class="g">GREEN</span> cars to absorb their power!' });
    ev.push({ d: 85,  type: 'cars', cars: [{ x: -3, p: 10 }, { x: 3, p: 12 }] });
    ev.push({ d: 125, type: 'cars', cars: [{ x: 0, p: 6 }, { x: 0, p: 7, dz: -9 }, { x: 0, p: 8, dz: -18 }], hint: 'Drag <span class="y">UP</span> to speed in and eat the whole convoy!' });
    ev.push({ d: 185, type: 'cars', cars: [{ x: 0, p: 70, kind: 'truck' }, { x: -3, p: 9 }], hint: '<span class="r">RED</span> is stronger than you. Dodge it!' });
    ev.push({ d: 245, type: 'pickup', kind: 'gun', xs: [-3, 0, 3], hint: 'Grab a <span class="y">GUN</span>!' });
    ev.push({ d: 300, type: 'cars', cars: [{ x: 0, p: 55 }], hint: 'Shoot it until it turns <span class="g">GREEN</span>, then ram it! Drag <span class="b">DOWN</span> to shoot longer.' });
    ev.push({ d: 360, type: 'gate' });
    ev.push({ d: 410, type: 'crate', x: 0, reward: 'g:guard', hint: 'Break crates for <span class="y">gadgets</span>!' });
    d = 460;
  } else if (INTRO[level]) {
    const it = INTRO[level];
    ev.push({ d: 70, type: it.enemy === 'biker' ? 'bikers' : it.enemy });
    if (it.hazard) ev.push({ d: 115, type: it.hazard === 'barrier' ? 'roadwork' : it.hazard });
    d = 160;
  } else d = 60;

  const U = unlocked(level);
  const pool = [['weak', 2.6], ['convoy', 1.6], ['strong', 3], ['cash', 0.7]];
  const add = { biker: ['bikers', 1.4], gunner: ['gunner', 1.3], shield: ['shield', 1.2], kamikaze: ['kamikaze', 1.1], splitter: ['splitter', 1.2] };
  const addH = { boost: ['boost', 0.8], oil: ['oil', 1], barrier: ['roadwork', 1], rocks: ['rocks', 0.9] };
  for (const e of U.enemies) if (add[e]) pool.push(add[e]);
  for (const h of U.hazards) if (addH[h]) pool.push(addH[h]);
  const total = pool.reduce((s, p) => s + p[1], 0);
  let lastGate = d - 70, lastCrate = d - 40;
  while (d < length - 30) {
    const prog = d / length;
    if (d - lastGate > 150) { ev.push({ d, type: 'gate' }); lastGate = d; }
    else if (d - lastCrate > 105 && Math.random() < 0.45) { ev.push({ d, type: 'crate', x: pick(LANES), reward: pick(CRATE_REWARDS) }); lastCrate = d; }
    else {
      let r = Math.random() * total, type = 'weak';
      for (const [t, w] of pool) { r -= w; if (r <= 0) { type = t; break; } }
      ev.push({ d, type, prog });
    }
    d += rand(22, 31) * (1 - 0.25 * prog);
  }
  return ev;
}
const CAR_COLORS = ['#ffd23f', '#ff7b54', '#9b5de5', '#f15bb5', '#00c2a8', '#fb8500', '#e63946', '#8ecae6', '#90be6d'];
const lvlScale = () => 1 + 0.18 * (run.level - 1);
function spawnEvent(e) {
  const z0 = -e.d, P = run.power;
  if (e.hint) showHint(e.hint, 3.4);
  const weakP = (a, b) => Math.max(2, Math.round(P * rand(a, b)));
  const lanes3 = () => shuffle([...LANES]);
  switch (e.type) {
    case 'cars': for (const c of e.cars) addEnemy(c.kind || 'car', c.x, z0 + (c.dz || 0), c.p, c.kind === 'truck' ? 6 : 9); break;
    case 'weak': for (const x of lanes3().slice(0, 1 + Math.floor(Math.random() * ((e.prog || 0) > 0.5 ? 3 : 2)))) addEnemy('car', x, z0 + rand(-3, 3), weakP(0.22, 0.6), rand(7, 11)); break;
    case 'convoy': { const x = pick(LANES), n = 3 + Math.floor((e.prog || 0) * 3); for (let i = 0; i < n; i++) addEnemy('car', x, z0 - i * 8, weakP(0.12, 0.3), 9); break; }
    case 'strong': {

    }
    case 'bikers': for (const x of lanes3().slice(0, 2 + (Math.random() < 0.4 ? 1 : 0))) { const b = addEnemy('biker', x, z0 + rand(-5, 5), weakP(0.15, 0.4), 13); b.baseX = x; } break;
    case 'gunner': addEnemy('gunner', pick(LANES), z0, Math.round(P * rand(1.0, 1.6) * lvlScale()), 10); break;
    case 'shield': { const s = addEnemy('shield', pick(LANES), z0, Math.round(P * rand(0.55, 1.1) * lvlScale()), 9); s.shield = s.shieldMax = Math.round(P * 0.5 + 10); break; }
    case 'kamikaze': addEnemy('kamikaze', pick(LANES), z0 - 10, weakP(0.25, 0.4), -6); break;
    case 'splitter': addEnemy('splitter', pick(LANES), z0, Math.round(P * rand(0.9, 1.5) * lvlScale()), 8); break;
    case 'boost': addHazard('boost', pick(LANES), z0); break;
    case 'oil': for (const x of lanes3().slice(0, Math.random() < 0.5 ? 1 : 2)) addHazard('oil', x, z0 + rand(-3, 3)); break;
    case 'roadwork': {
      const open = pick(LANES);
      for (const x of LANES) if (x !== open) { addEnemy('barrier', x, z0, 0, 0); addEnemy('barrier', x, z0 - 9, 0, 0); for (let k = 0; k < 3; k++) addHazard('cone', x + rand(-1, 1), z0 + 3 + k * 1.5); }
      break;
    }
    case 'rocks': for (let k = 0; k < 3; k++) addHazard('rockfall', pick(LANES), z0 - k * 11); break;
    case 'crate': addCrate(e.x, z0, Math.round(P * rand(0.6, 1.1) * lvlScale()), e.reward); break;
    case 'cash': { const x = pick(LANES); for (let i = 0; i < 6; i++) addPickup('cash', x, z0 - i * 2.2); break; }
    case 'pickup': for (const x of e.xs) addPickup(e.kind, x, z0); break;
    case 'gate': addGate(z0); break;

}

function addEnemy(kind, x, z, power, speed, opts = {}) {

    group: v.g, wl: v.wl, extra: v.extra, label: null, hitT: 0, wob: rand(0, 6.28), dead: false,
    hazard: kind === 'mine' || kind === 'kamikaze', indestructible: kind === 'barrier' || kind === 'rock',

function addCrate(x, z, hp, reward) {

  const col = gid ? GADGET[gid].color : { gun: '#3d3d3d', rate: '#2e9bff', cash: '#ffc21a', power: '#22c55e' }[reward];

function removeEnemy(e) { scene.remove(e.group); if (e.label) disposeLabel(e.label); }
const REWARD_TEXT = { gun: 'GUN +1', rate: 'FIRE RATE', cash: 'CASH', power: 'POWER' };

}

function damageEnemy(e, dmg, src) {
  if (e.dead) return;
  if (e.indestructible) { if (src === 'bullet') sparks(e.x, 1, e.z + e.l / 2, '#ffd23f', 3); return; }
  if (e.shield > 0) {
    if (src === 'laser' || src === 'siren') breakShield(e);
    else {
      e.shield -= dmg; e.hitT = 0.05; sfx.ping();
      if (e.extra.shield) e.extra.shield.material.emissiveIntensity = 2;
      if (e.shield <= 0) breakShield(e);
      return;
    }
  }
  if (e.kind === 'boss') dmg *= 0.45; // armoured: guns weaken it, ramming finishes it
  e.power -= dmg; e.hitT = 0.06;
  if (e.kind === 'boss') e.power = Math.max(1, e.power); // a boss is only finished by ramming

}

function killEnemy(e, how) {
  if (e.dead) return;
  e.dead = true;
  const pos = new THREE.Vector3(e.x, e.y, e.z);
  if (e.kind === 'mine') { explosion(pos, 0.6); sfx.boom(); return; }
  if (e.kind === 'barrier' || e.kind === 'rock') { scrap(pos, e.kind === 'rock' ? '#8d7b68' : '#ff6b1a', 10, false); sfx.smash(); shake = Math.max(shake, 0.25); return; }
  if (e.kind === 'crate') { explosion(pos, 0.7); scrap(pos, '#c9853f', 10, false); applyReward(e.reward); sfx.smash(); return; }
  explosion(pos, e.kind === 'boss' ? 2.4 : e.kind === 'truck' ? 1.3 : e.kind === 'kamikaze' ? 1.6 : 1);
  sfx.smash();
  if (e.kind === 'kamikaze') { sfx.boom(); for (const o of enemies) if (o !== e && !o.dead && Math.hypot(o.x - e.x, o.z - e.z) < 4.5) damageEnemy(o, 15 * lvlScale(), 'splash'); }

  if (how === 'ram') {
    const gain = Math.max(1, Math.ceil(e.max * absorbOf(save.parts.crusher)));
    gainPower(gain);
    addCash(Math.ceil(e.max * 0.5) + 2);

    addCash(Math.ceil(e.max * 0.2) + 1);

    shake = Math.max(shake, 0.12);
  }
  if (e.kind === 'splitter') {
    for (const s of [-1, 1]) addEnemy('car', clamp(e.x + s * 1.6, -3, 3), e.z - 3, Math.max(2, Math.round(e.max * 0.3)), 9);
    showHint('It split! <span class="g">Eat both!</span>', 1.6);

  if (e && run.hammer > 0 && !e.hazard) {
    run.hammer--;
    if ((save.gadgets.hammer || 0) > 0) { save.gadgets.hammer--; persist(); }
    swingHammer();
    if (e.kind === 'boss') { e.power *= 0.7; e.gap = 18; }
    else killEnemy(e, e.indestructible ? 'shot' : 'ram');

function gateOptions() {

    { text: 'x1.3', sub: 'FIRE RATE', good: true, apply: () => { run.rateMul *= 1.3; } },

  const gg = pick(['guard', 'emp', 'drone', 'magnet', 'gold']);
  good.push({ text: GADGET[gg].name.toUpperCase(), sub: 'GADGET', good: true, gadget: gg, apply: () => activate(gg) });

function addHazard(type, x, z) {

    a.rotation.x = -Math.PI / 2; a.scale.set(1.5, 1.1, 1); a.position.y = 0.02; mesh.add(a);
    const b = new THREE.Mesh(GEO.disc, new THREE.MeshBasicMaterial({ color: '#6d28d9', transparent: true, opacity: 0.25 }));
    b.rotation.x = -Math.PI / 2; b.scale.set(0.8, 0.5, 1); b.position.set(0.3, 0.025, -0.2); mesh.add(b);
  } else if (type === 'boost') {
    mesh = new THREE.Group();
    mesh.add(part(GEO.box, '#14532d', [2.2, 0.04, 3.4], [0, 0.02, 0]));

}

}

        if (p.hitSet && p.hitSet.has(e)) continue;
        if (p.pierce > 0) { p.pierce--; (p.hitSet = p.hitSet || new Set()).add(e); } else p.dead = true;
        if (p.splash) { damageEnemy(e, p.dmg * 0.4, 'bullet'); explodeAt(p.x, e.z + e.l / 2, p.splash, p.dmg * 0.6); }
        else { if (p.cash) addCash(p.cash); damageEnemy(e, p.dmg, 'bullet'); burst(new THREE.Vector3(p.x, 1.2, e.z + e.l * 0.5), '#fff3a0', 0.45, 0.12); sfx.hit(); }
        if (p.dead) break;
      }
    }
  }
  for (let i = projectiles.length - 1; i >= 0; i--) if (projectiles[i].dead) { scene.remove(projectiles[i].mesh); projectiles.splice(i, 1); }
}

// ======================================================================
// BOSS
// ======================================================================
function spawnBoss() {
  const B = BOSSES[(run.level - 1) % BOSSES.length];
  const p = Math.round(run.power * Math.min(3, 2 + 0.15 * (run.level - 1)));
  const color = B.id === 'tankboss' ? '#7a8b4a' : B.id === 'monster' ? '#7c3aed' : '#c1121f';
  const e = addEnemy('boss', 0, -run.dist - 55, p, 0, { variant: B.id, color });
  Object.assign(e, { gap: 55, bt: 0, phase: 'cruise', timer: 2.6, warn: null });
  run.boss = e;
  sfx.horn();
  sfx.setSong('boss', 57);
  flash('BOSS!', '#ff3b4d', 1.3);
  showHint(`<span class="r">${B.name}</span> ${B.hint}. Shoot it to <span class="g">GREEN</span>, then ram it!`, 4);
}
function updateBoss(e, dt) {
  const anchor = -run.dist;
  const weak = canRam(e);
  e.bt += dt;
  if (!weak && e.bt > 28) e.power = Math.max(1, e.power - e.max * 0.04 * dt); // long fights wear the boss down
  const V = e.variant;
  let gapTarget = weak ? 2 : 16;
  if (V === 'armored') {
    e.x = Math.sin(e.bt * (weak ? 0.6 : 0.9)) * (weak ? 1.6 : 2.4);
    e.timer -= dt;
    if (!weak && e.timer <= 0) { e.timer = rand(0.7, 1.2); addEnemy('mine', e.x + rand(-0.6, 0.6), e.z + 3.6, 3 + run.level, run.speed - 9); }
    e.gap += (gapTarget - e.gap) * Math.min(1, dt * (weak ? 0.9 : 1.2));
  } else if (V === 'monster') {
    e.timer -= dt;
    if (weak) { e.phase = 'cruise'; clearWarn(e); }
    if (e.phase === 'cruise') {
      e.x += (Math.sin(e.bt * 0.8) * 2.2 - e.x) * Math.min(1, dt * 2);
      e.gap += (gapTarget - e.gap) * Math.min(1, dt * 1.2);
      if (!weak && e.timer <= 0) {
        e.phase = 'warn'; e.timer = 1.0; e.lane = LANES.reduce((a, b) => Math.abs(b - player.x) < Math.abs(a - player.x) ? b : a);
        e.warn = new THREE.Mesh(GEO.box, new THREE.MeshBasicMaterial({ color: '#ff3b4d', transparent: true, opacity: 0.35, depthWrite: false }));
        e.warn.scale.set(2.6, 0.02, 30); scene.add(e.warn); sfx.warn();
      }
    } else if (e.phase === 'warn') {
      e.x += (e.lane - e.x) * Math.min(1, dt * 5);
      e.warn.position.set(e.lane, 0.05, anchor - 4);
      e.warn.material.opacity = 0.2 + 0.25 * (Math.floor(e.bt * 10) % 2);
      if (e.timer <= 0) { e.phase = 'charge'; clearWarn(e); }
    } else if (e.phase === 'charge') {
      e.gap -= 30 * dt;
      if (e.gap < -12) { e.phase = 'return'; }
    } else if (e.phase === 'return') {
      e.gap += 18 * dt;
      if (e.gap >= 16) { e.phase = 'cruise'; e.timer = rand(1.4, 2.2); }
    }
  } else if (V === 'tankboss') {
    e.x = Math.sin(e.bt * 0.7) * 2.2;
    e.gap += (gapTarget - e.gap) * Math.min(1, dt * 1.2);
    const tur = e.extra.turret;
    if (tur) tur.rotation.y = Math.atan2(-(player.x - e.x), (playerZ() - e.z)) + Math.PI;
    e.timer -= dt;
    if (!weak && e.timer <= 0) {
      e.timer = rand(1.1, 1.6);
      const tx = clamp(player.x + rand(-0.5, 0.5), -3.5, 3.5), tz = playerZ() - run.speed * 1.1;
      const ring = addHazard('rockfall', tx, tz); ring.shell = true; ring.armed = true; ring.t = 0; ring.from = new THREE.Vector3(e.x, 3, e.z);
      burst(new THREE.Vector3(e.x, 3, e.z + 3), '#ffb000', 1.2, 0.15); sfx.rocket();
    }
  }
  e.z = anchor - e.gap - player.l * player.scale * 0.5;
}
function clearWarn(e) { if (e.warn) { scene.remove(e.warn); e.warn.material.dispose(); e.warn = null; } }

function winLevel() {
  if (run.over) return;
  run.over = true;
  if (run.boss) clearWarn(run.boss);
  run.cash += 80 + run.level * 40;
  sfx.win();
  flash('BOSS DOWN!', '#22c55e', 1.6);
  setTimeout(() => showResult(true), 1800);
}
function loseLevel() {
  if (run.over) return;
  run.over = true;
  if (run.boss) clearWarn(run.boss);
  const pos = new THREE.Vector3(player.x, 0, playerZ());
  explosion(pos, 1.4); scrap(pos, run.car.color, 14, false);
  player.group.visible = false; drone.visible = false;
  sfx.boom();
  flash('WRECKED', '#ff3b4d', 1.6);
  setTimeout(() => showResult(false), 1800);
}

// ======================================================================
// AUTOPILOT AI: chase what it can eat, sidestep what it can't
// ======================================================================
function autopilotSteer() {
  const pz = playerZ();
  const ahead = enemies.filter(e => !e.dead && e.z < pz + 2 && e.z > pz - 34);
  const threats = ahead.filter(e => !canRam(e));
  for (const h of hazards) if ((h.type === 'oil' || (h.type === 'rockfall' && h.armed)) && h.z < pz + 2 && h.z > pz - 25) threats.push({ x: h.x, z: h.z, w: 2.4 });
  for (const b of ebullets) threats.push({ x: b.x, z: b.z, w: 1 });
  const food = ahead.filter(e => canRam(e) && e.kind !== 'boss').sort((a, b) => b.z - a.z);
  apTarget = food[0] || null;
  const blocked = x => threats.some(t => Math.abs(t.x - x) < (t.w || 2) / 2 + player.w * player.scale / 2 + 0.3 && t.z > pz - 24);
  let want = food.length ? food[0].x : player.x;
  if (blocked(want)) {
    const cands = [...LANES, player.x].filter(x => !blocked(x)).sort((a, b) => Math.abs(a - want) - Math.abs(b - want));
    if (cands.length) want = cands[0];
  }
  player.targetX = want;
  player.targetOZ = food.length && !blocked(want) ? -4.5 : 0;
}

// ======================================================================
// MAIN UPDATE
// ======================================================================
const keys = {};
addEventListener('keydown', e => { keys[e.key] = true; });
addEventListener('keyup', e => { keys[e.key] = false; });

function updatePlay(dt) {
  const r = run, F = r.fx, P = save.parts;
  r.t += dt;
  for (const k of ['guard', 'nitro', 'magnet', 'gold', 'drone', 'boost', 'slide']) if (F[k] > 0) F[k] = Math.max(0, F[k] - dt);

  // --- movement: drag in 4 directions; motor = handling, wheels = speed
  const motor = P.motor, steer = 7 + motor * 1.4;
  if (keys.ArrowLeft || keys.a) player.targetX -= (9 + motor) * dt;
  if (keys.ArrowRight || keys.d) player.targetX += (9 + motor) * dt;
  if (keys.ArrowUp || keys.w) player.targetOZ -= (9 + motor) * dt;
  if (keys.ArrowDown || keys.s) player.targetOZ += (9 + motor) * dt;
  if (F.autopilot > 0 && !r.over) autopilotSteer();
  if (F.slide > 0) { player.targetX += r.slideDir * 7 * dt; player.spin += dt * 14 * r.slideDir; } else player.spin *= 1 - Math.min(1, dt * 10);
  const lim = ROAD_HALF - 0.45 - player.w * player.scale / 2;
  const ozMin = -(5 + motor * 0.4), ozMax = 2.6;
  if (F.nitro > 0) player.targetOZ = Math.min(player.targetOZ, -5);
  player.targetX = clamp(player.targetX, -lim, lim);
  player.targetOZ = clamp(player.targetOZ, ozMin, ozMax);
  const prevX = player.x;
  player.x += (player.targetX - player.x) * Math.min(1, dt * steer);
  player.oz += (player.targetOZ - player.oz) * Math.min(1, dt * steer * 0.6);
  const mult = F.nitro > 0 ? 1.7 : F.boost > 0 ? 1.45 : 1;
  if (!r.over) {
    const step = r.speed * mult * dt;
    r.dist += step;
    if (F.autopilot > 0) { F.autopilot = Math.max(0, F.autopilot - step); if (F.autopilot === 0) { flash('YOU DRIVE!', '#c4b5fd', 1.1); sfx.autopilot(false); apTarget = null; player.targetOZ = 0; } }
  }
  const pz = playerZ();
  updateAutopilotFx(F.autopilot > 0 && !r.over, pz);
  sfx.engineSet(clamp((mult - 1) * 1.5 + 0.4 - player.oz * 0.06, 0, 1.4));
  const baseScale = { tank: 0.82, fire: 0.88, garbage: 0.86, monster: 0.86, ambulance: 0.92, icecream: 0.92 }[r.car.id] || 1;
  player.scale += (baseScale * clamp(0.9 + 0.2 * Math.log2(Math.max(1, r.power) / 20), 0.9, 1.3) - player.scale) * Math.min(1, dt * 4);
  player.group.position.set(player.x, 0, pz);
  player.group.scale.setScalar(player.scale);
  player.body.rotation.y = clamp(-(player.x - prevX) / Math.max(dt, 0.001) * 0.03, -0.35, 0.35) + player.spin;
  player.body.rotation.z = clamp((player.x - prevX) / Math.max(dt, 0.001) * 0.01, -0.08, 0.08);
  if (player.model) for (const w of player.model.wl) w.rotation.x -= r.speed * mult * dt * 2.5;
  player.label.spr.visible = true;
  drawLabel(player.label, String(r.power), 'POWER', BLUE);
  bubble.visible = F.guard > 0; if (bubble.visible) bubble.material.opacity = 0.16 + 0.08 * Math.sin(r.t * 10);
  if (r.invuln > 0) { r.invuln -= dt; player.body.visible = F.guard > 0 || Math.floor(r.invuln * 12) % 2 === 0; } else player.body.visible = true;
  if (r.hearts === 1 && !r.over && Math.random() < dt * 12) smoke(player.x + rand(-0.4, 0.4), 1.2 * player.scale, pz - 1, '#4b5563', 0.3);
  if ((F.nitro > 0 || F.boost > 0) && Math.random() < dt * 30) smoke(player.x + rand(-0.6, 0.6), 0.4, pz + player.l * player.scale / 2, F.nitro > 0 ? '#fb923c' : '#4ade80', 0.25);

  recycleChunks(-r.dist);

  // --- spawn
  while (r.evIdx < r.events.length && r.events[r.evIdx].d <= r.dist + 75) spawnEvent(r.events[r.evIdx++]);
  if (r.level === 1 && r.dist > 300 && r.barrels === 0) addBarrel();
  if (!r.boss && r.dist >= r.length) spawnBoss();

  // --- enemies
  const pw = player.w * player.scale * 0.5, pl = player.l * player.scale * 0.5;
  for (const e of enemies) {
    if (e.dead) continue;
    if (e.stun > 0) e.stun -= dt;
    if (e.kind === 'boss') updateBoss(e, dt);
    else if (e.stun <= 0) {
      e.z -= e.speed * dt;
      if (e.kind === 'biker') e.x = clamp(e.baseX + Math.sin(r.t * 1.6 + e.wob) * 1.6, -3.6, 3.6);
      else if (e.kind === 'car' && e.speed > 0) e.group.rotation.y = Math.sin((e.wob += dt) * 2) * 0.03;
      else if (e.kind === 'gunner') {
        const dz = pz - e.z;
        if (e.extra.turret) e.extra.turret.rotation.y = Math.atan2(player.x - e.x, dz) * 0.8;
        e.fireT -= dt;
        if (e.fireT <= 0 && dz > 8 && dz < 38 && !r.over) { e.fireT = 1.0; enemyShot(e); }
      } else if (e.kind === 'kamikaze' && e.extra.beacon) e.extra.beacon.visible = Math.floor(r.t * 8) % 2 === 0;
    }
    if (e.wl) for (const w of e.wl) w.rotation.x -= (e.kind === 'boss' ? r.speed : Math.max(e.speed, 0)) * dt * 2;
    if (e.extra.top) e.extra.top.rotation.y += dt * 2;
    if (e.extra.shield) e.extra.shield.material.emissiveIntensity += (0.9 - e.extra.shield.material.emissiveIntensity) * Math.min(1, dt * 8);
    if (e.y > 0) { e.y = Math.max(0, e.y - dt * 40); if (e.y === 0) { shake = Math.max(shake, 0.3); sfx.boom(); scrap(new THREE.Vector3(e.x, 0, e.z), '#a08c76', 6, false); } }
    e.group.position.set(e.x, e.y, e.z);
    e.group.scale.setScalar(e.hitT > 0 ? 1 + e.hitT * 1.3 : 1);
    if (e.hitT > 0) e.hitT -= dt;
    if (e.stun > 0) e.group.rotation.y = Math.sin(r.t * 30) * 0.08;
    updateEnemyLabel(e);

    if (!r.over && e.y < 1 && Math.abs(e.x - player.x) < pw + e.w * 0.5 - 0.1 && Math.abs(e.z - pz) < pl + e.l * 0.5 - 0.1) {
      if (canRam(e)) killEnemy(e, 'ram');
      else hurtPlayer(e);
    }
    if (e.z > -r.dist + 16 || e.z < -r.dist - 260) e.dead = true;
  }
  for (let i = enemies.length - 1; i >= 0; i--) if (enemies[i].dead) { removeEnemy(enemies[i]); enemies.splice(i, 1); }

  updateWeapons(dt);
  updateProjectiles(dt);

  // --- enemy bullets
  for (const b of ebullets) {
    b.x += b.vx * dt; b.z += b.vz * dt; b.mesh.position.set(b.x, 1.2, b.z);
    if (!r.over && Math.abs(b.x - player.x) < pw + 0.25 && Math.abs(b.z - pz) < pl + 0.25) { b.dead = true; hurtPlayer(null); }
    if (b.z > -r.dist + 14) b.dead = true;
  }
  for (let i = ebullets.length - 1; i >= 0; i--) if (ebullets[i].dead) { scene.remove(ebullets[i].mesh); ebullets.splice(i, 1); }

  // --- hazards
  for (const h of hazards) {
    const dx = Math.abs(h.x - player.x), dz = Math.abs(h.z - pz);
    if (h.type === 'oil' && !h.used && dx < 1.3 + pw * 0.6 && dz < 1.2 + pl * 0.5 && F.nitro <= 0 && F.autopilot <= 0) {
      h.used = true; F.slide = 1.1 * (1 - 0.06 * P.wheels); r.slideDir = Math.random() < 0.5 ? -1 : 1; sfx.hurt(); flash('SLIP!', '#a78bfa', 0.7);
    } else if (h.type === 'boost' && !h.used && dx < 1.2 + pw * 0.5 && dz < 1.8 + pl * 0.5) {
      h.used = true; F.boost = 2.2; sfx.gadget(); flash('BOOST!', '#4ade80', 0.7);
    } else if (h.type === 'rockfall') {
      if (!h.armed && h.z - pz > -26 && h.z < pz + 2) { h.armed = true; h.t = 0; sfx.warn(); }
      if (h.armed) {
        h.t += dt;
        h.mesh.material.opacity = 0.35 + 0.35 * (Math.floor(h.t * 10) % 2);
        h.mesh.scale.setScalar(1.3 + h.t * 0.3);
        if (h.shell && h.from) {
          if (!h.ball) { h.ball = part(GEO.sphere, '#2f3326', [0.35, 0.35, 0.35], [h.from.x, h.from.y, h.from.z]); scene.add(h.ball); }
          const k = Math.min(1, h.t / 1.0);
          h.ball.position.set(h.from.x + (h.x - h.from.x) * k, h.from.y + 6 * Math.sin(Math.PI * k), h.from.z + (h.z - h.from.z) * k);
        }
        if (h.t >= (h.shell ? 1.0 : 0.9) && !h.used) {
          h.used = true;
          if (h.ball) { scene.remove(h.ball); h.ball = null; }
          if (h.shell) {
            explosion(new THREE.Vector3(h.x, 0, h.z), 1.1); sfx.boom(); shake = Math.max(shake, 0.3);
            if (Math.abs(h.x - player.x) < 1.8 + pw && Math.abs(h.z - pz) < 1.8 + pl) hurtPlayer(null);
          } else {
            const rock = addEnemy('rock', h.x, h.z, 0, 0); rock.y = 14;
            if (Math.abs(h.x - player.x) < 0.9 + pw && Math.abs(h.z - pz) < 0.9 + pl) setTimeout(() => { if (run && !rock.dead) hurtPlayer(rock); }, 330);
          }
          h.mesh.visible = false;
        }
      }
    }
    if (h.type === 'boost') h.mesh.children.forEach((c, i) => { if (i) c.material = mat('#4ade80', { emissive: '#22c55e', emissiveIntensity: Math.floor(r.t * 6 + i) % 3 === 0 ? 1.6 : 0.6 }); });
    if (h.z > -r.dist + 16) h.dead = true;
  }
  for (let i = hazards.length - 1; i >= 0; i--) if (hazards[i].dead) { const h = hazards[i]; scene.remove(h.mesh); if (h.ball) scene.remove(h.ball); hazards.splice(i, 1); }

  // --- gates: decided by which side of the centre post you are on as you cross
  for (const g of gates) {
    if (!g.used && pz - pl <= g.z) {
      g.used = true;
      const side = Math.abs(player.x) < 0.35 ? (player.targetX < 0 ? 0 : 1) : (player.x < 0 ? 0 : 1);
      const o = g.opts[side];
      o.apply(); sfx.gate(o.good);
      g.panels[side].material.opacity = 0.9;
      burst(new THREE.Vector3(side ? ROAD_HALF / 2 : -ROAD_HALF / 2, 1.5, g.z), o.good ? '#7cc4ff' : '#ff6b7a', 2.4, 0.3);
      if (!o.gadget) flash(o.text + ' ' + o.sub, o.good ? '#7cc4ff' : '#ff6b7a', 0.9);
    }
    if (g.used) { for (const p of g.panels) p.material.opacity = Math.max(0, p.material.opacity - dt * 1.5); }
  }
  for (let i = gates.length - 1; i >= 0; i--) if (gates[i].z > -r.dist + 16) { scene.remove(gates[i].group); gates[i].labels.forEach(disposeLabel); gates.splice(i, 1); }

  // --- pickups
  for (const p of pickups) {
    if (p.vz || p.vy || p.y > 0.95) {
      p.vy -= 20 * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      if (p.y <= 0.9) { p.y = 0.9; if (Math.abs(p.vy) > 3) p.vy = -p.vy * 0.35; else p.vy = 0; p.vz *= 0.5; if (Math.abs(p.vz) < 0.5) p.vz = 0; }
    }
    if (F.magnet > 0 && Math.hypot(p.x - player.x, p.z - pz) < 16) {
      const k = Math.min(1, dt * 6); p.x += (player.x - p.x) * k; p.z += (pz - p.z) * k;
    }
    p.mesh.position.set(p.x, p.y + Math.sin(r.t * 4 + p.z) * 0.12, p.z);
    p.mesh.rotation.y += dt * 3;
    if (p.L) p.L.spr.position.set(p.x, p.y + 1.4, p.z);
    if (!p.got && Math.abs(p.x - player.x) < pw + 0.7 && Math.abs(p.z - pz) < pl + 0.7) {
      p.got = true;
      if (p.type === 'cash') { addCash(3 + r.level); sfx.coin(); }
      else if (p.type === 'bundle') { const c = 15 + r.level * 4; addCash(c); popup('$' + c, AMBER); sfx.coin(); }
      else if (p.type === 'power') { gainPower(Math.round(r.power * 0.1) + 3); sfx.pickup(); }
      else if (p.type === 'gun') { if (r.barrels === 0) { addBarrel(); sfx.pickup(); } for (const q of pickups) if (q.type === 'gun') q.got = true; }
      else if (p.type === 'gadget') activate(p.gadget);
    }
  }
  for (let i = pickups.length - 1; i >= 0; i--) { const p = pickups[i]; if (p.got || p.z > -r.dist + 16) { removePickup(p); pickups.splice(i, 1); } }

  // --- popups drift up beside the car (never over the road ahead)
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i]; p.t += dt;
    p.L.spr.position.set(player.x + 1.9 * p.side, 1.6 + p.t * 2.2, pz + 1);
    p.L.spr.material.opacity = 1 - Math.max(0, p.t - 0.5) * 2;
    if (p.t > 1) { scene.remove(p.L.spr); disposeLabel(p.L); popups.splice(i, 1); }
  }

  // --- tutorial overlay
  if (r.tutUntil > 0) {
    r.tutUntil -= dt;
    if (r.tutUntil <= 0 || (r.movedX && r.movedY && r.t > 2)) { r.tutUntil = 0; $('tut').classList.add('off'); save.tutorialDone = true; persist(); }
  }
  updateHud();
}
function enemyShot(e) {
  const m = new THREE.Mesh(GEO.sphere, mat('#ff3b4d', { emissive: '#ff1f35', emissiveIntensity: 1.5 }));
  m.scale.setScalar(0.28); scene.add(m);
  const rel = 13, vz = run.speed + rel, dz = playerZ() - e.z, t = dz / rel;
  ebullets.push({ mesh: m, x: e.x, z: e.z + e.l / 2, vx: (player.x - e.x) / Math.max(t, 0.3), vz });
  burst(new THREE.Vector3(e.x, 1.5, e.z + 1), '#ff6b7a', 0.5, 0.1);
  sfx.shot();
}

// ======================================================================
// CAMERA + LOOP
// ======================================================================
const camState = { pos: new THREE.Vector3(8, 4, 8), look: new THREE.Vector3(0, 1, 0) };
let garageT = 0, showcaseZ = 0;
function updateCamera(rdt) {
  let pos, look, anchor = showcaseZ;
  if (state === 'play' && run) {
    anchor = -run.dist;
    const s = player.scale;
    pos = new THREE.Vector3(player.x * 0.4, 9.4 + s * 1.3, anchor + 10 + s);
    look = new THREE.Vector3(player.x * 0.5, 0, anchor - 10);
  } else {
    garageT += rdt;
    const a = garageT * 0.35, r = (state === 'garage' ? 7.5 : 7) + player.l * 1.1;
    pos = new THREE.Vector3(Math.sin(a) * r, state === 'garage' ? 4.6 : 4.4, showcaseZ + Math.cos(a) * r);
    look = new THREE.Vector3(0, state === 'garage' ? -2.2 : 0.4, showcaseZ);
  }
  const k = 1 - Math.exp(-6 * rdt);
  camState.pos.lerp(pos, k); camState.look.lerp(look, k);
  shake = Math.max(0, shake - rdt * 1.2);
  camera.position.copy(camState.pos);

// ---------- music / sound toggles + autopilot takeover ----------
function renderToggles() {
  document.querySelectorAll('.tg-music').forEach(b => { b.innerHTML = icon('music', save.settings.music); b.setAttribute('aria-pressed', save.settings.music); });
  document.querySelectorAll('.tg-sfx').forEach(b => { b.innerHTML = icon('sound', save.settings.sfx); b.setAttribute('aria-pressed', save.settings.sfx); });
}
document.querySelectorAll('.tg-music').forEach(b => b.addEventListener('click', () => { sfx.init(); save.settings.music = !save.settings.music; sfx.setMusic(save.settings.music); persist(); renderToggles(); }));
document.querySelectorAll('.tg-sfx').forEach(b => b.addEventListener('click', () => { sfx.init(); save.settings.sfx = !save.settings.sfx; sfx.setSfx(save.settings.sfx); persist(); renderToggles(); sfx.click(); }));
$('apWheel').innerHTML = icon('autopilot');
$('setBtn').innerHTML = icon('gear'); $('homeBtn').innerHTML = icon('home'); $('closeSet').innerHTML = icon('close');
let paused = false;
function openMenu() {
  sfx.init(); sfx.click(); renderToggles();
  const inGame = state === 'play' || state === 'garage';
  $('resumeBtn').hidden = !inGame; $('menuHome').hidden = !inGame; $('resetBtn').hidden = state === 'play';
  $('menuTitle').textContent = state === 'play' ? 'Paused' : 'Settings';
  if (state === 'play') { paused = true; sfx.engineStop(); }
  $('settings').hidden = false;
}
function closeMenu() { $('settings').hidden = true; if (paused) { paused = false; last = performance.now(); sfx.engineStart(); } }
$('setBtn').addEventListener('click', openMenu);
$('pauseBtn').addEventListener('pointerdown', e => { e.stopPropagation(); openMenu(); });
$('gPause').addEventListener('click', openMenu);
$('resumeBtn').addEventListener('click', () => { sfx.click(); closeMenu(); });
$('menuHome').addEventListener('click', () => { sfx.click(); $('settings').hidden = true; paused = false; if (run) { clearEntities(); run = null; } setState('title'); });
$('pauseBtn').innerHTML = icon('pause'); $('gPause').innerHTML = icon('pause');
$('closeSet').addEventListener('click', () => { sfx.click(); closeMenu(); });
$('homeBtn').addEventListener('click', () => { sfx.click(); setState('title'); });
$('iSmash').innerHTML = icon('crusher'); $('iShot').innerHTML = icon('target'); $('iPower').innerHTML = icon('bolt'); $('iCash').innerHTML = icon('coin');
$('apStop').addEventListener('pointerdown', ev => {
  ev.stopPropagation();
  if (!run || run.fx.autopilot <= 0) return;
  run.fx.autopilot = 0; apTarget = null; player.targetOZ = 0;
  flash('YOU DRIVE!', '#c4b5fd', 1.1); sfx.autopilot(false);
});
document.addEventListener('pointerdown', () => sfx.init(), { once: true });
</script>
