<style>
/* Layout: one phone-shaped arcade cabinet centered in a dusk-purple room; UI floats over the 3D lane. */
:root {
  --room: #150f26;
  --night: #221a3d;
  --ink: #fff7ec;
  --muted: #b9acd9;
  --gold: #ffc93c;
  --coral: #ff5d7a;
  --mint: #63f0a0;
  --sky: #5fd4ff;
  --display: "Bowlby One", "Arial Black", Impact, sans-serif;
  --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 0%, #2c2050 0%, var(--room) 60%);
  background-color: var(--room);
  color: var(--ink);
  font-family: var(--body);
  display: grid;
  place-items: center;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#stage {
  position: relative;
  overflow: hidden;
  border-radius: 22px;
  background: var(--night);
  box-shadow: 0 0 0 3px #3a2c66, 0 30px 80px rgba(0,0,0,.55);
  --u: 4px;
  touch-action: none;
}
canvas#game { display: block; width: 100%; height: 100%; }

/* HUD */
.hud { position: absolute; inset: 0 0 auto 0; padding: calc(var(--u)*3) calc(var(--u)*4) calc(var(--u)*2);
  background: linear-gradient(rgba(10,6,24,.6), rgba(10,6,24,0)); pointer-events: none; }
.hud-row { display: flex; justify-content: space-between; align-items: center; gap: calc(var(--u)*2); }
.stage-lbl { font: 800 calc(var(--u)*3.6)/1 var(--body); letter-spacing: .08em; text-transform: uppercase; }
.stage-lbl.boss { color: var(--coral); }
.hearts { font-size: calc(var(--u)*5); color: var(--coral); letter-spacing: .05em; line-height: 1; }
.score { font: calc(var(--u)*11)/1 var(--display); text-align: center; margin-top: calc(var(--u)*1.5);
  text-shadow: 0 calc(var(--u)*.6) 0 rgba(0,0,0,.35); font-variant-numeric: tabular-nums; }
.score small { font-size: .5em; color: var(--muted); }
.score.done { color: var(--mint); }
.bar { height: calc(var(--u)*1.8); width: 62%; margin: calc(var(--u)*1.6) auto 0; border-radius: 99px; background: rgba(255,255,255,.15); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), #ff9f3c); border-radius: inherit; transition: width .3s; }
.balls { display: flex; justify-content: center; gap: calc(var(--u)*1.4); margin-top: calc(var(--u)*1.8); align-items: center; }
.balls span { width: calc(var(--u)*2.6); height: calc(var(--u)*2.6); border-radius: 50%; background: var(--sky); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
.balls span.used { background: rgba(255,255,255,.18); box-shadow: none; }
.balls em { font: 600 calc(var(--u)*2.8)/1 var(--body); font-style: normal; color: var(--gold); margin-left: calc(var(--u)*1.5); }

.owned { position: absolute; left: 0; right: 0; bottom: 0; padding: calc(var(--u)*3); display: flex; flex-wrap: wrap; gap: calc(var(--u)*1.2); justify-content: center; pointer-events: none; }
.chip { font: 600 calc(var(--u)*2.6)/1 var(--body); padding: calc(var(--u)*1.1) calc(var(--u)*1.8); border-radius: 99px; background: rgba(10,6,24,.6); border: 1px solid rgba(255,255,255,.15); }
.chip b { color: var(--gold); margin-left: .35em; }
.hint { position: absolute; left: 0; right: 0; bottom: 16%; text-align: center; font: 800 calc(var(--u)*4.2)/1.25 var(--body); pointer-events: none; text-shadow: 0 2px 8px rgba(0,0,0,.6); animation: bob 1.4s ease-in-out infinite; }
.hint span { display: block; font-weight: 400; font-size: .62em; color: var(--muted); margin-top: .4em; }
@keyframes bob { 50% { transform: translateY(calc(var(--u)*-1.5)); } }

.flash { position: absolute; left: 0; right: 0; top: 34%; text-align: center; font: calc(var(--u)*12)/1 var(--display); pointer-events: none; opacity: 0; text-shadow: 0 calc(var(--u)*.8) 0 rgba(0,0,0,.4); }
.flash.go { animation: flash var(--d, 1.1s) ease-out forwards; }
@keyframes flash { 0% { opacity: 0; transform: scale(1.8); } 12% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(1) translateY(calc(var(--u)*-3)); } }
.pop { position: absolute; left: 0; right: 0; top: 46%; text-align: center; font: calc(var(--u)*8)/1 var(--display); color: var(--gold); pointer-events: none; opacity: 0; }
.pop.go { animation: pop 1s ease-out forwards; }
@keyframes pop { 0% { opacity: 0; transform: translateY(0) scale(.6); } 15% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0; transform: translateY(calc(var(--u)*-14)); } }

/* Panels */
.panel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u)*3); padding: calc(var(--u)*6); text-align: center; }
.panel.dim { background: rgba(14,8,30,.72); backdrop-filter: blur(3px); }
.logo { font: calc(var(--u)*15)/.9 var(--display); color: var(--gold); text-shadow: 0 calc(var(--u)*1.2) 0 #b5364f; transform: rotate(-4deg); }
.logo span { display: block; color: var(--ink); text-shadow: 0 calc(var(--u)*1.2) 0 #4b3a8a; }
.tag { font: 600 calc(var(--u)*3.4)/1.3 var(--body); color: var(--sky); letter-spacing: .14em; text-transform: uppercase; }
.small { font: 400 calc(var(--u)*3.1)/1.45 var(--body); color: var(--muted); max-width: 32ch; }
.btn { font: calc(var(--u)*6)/1 var(--display); color: var(--ink); background: var(--coral); border: 0; border-radius: calc(var(--u)*4);
  padding: calc(var(--u)*3.6) calc(var(--u)*10); box-shadow: 0 calc(var(--u)*1.4) 0 #a52a47; cursor: pointer; transition: transform .1s, box-shadow .1s; }
.btn:active { transform: translateY(calc(var(--u)*1)); box-shadow: 0 calc(var(--u)*.4) 0 #a52a47; }
.btn:focus-visible, .card:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.panel h2 { font: calc(var(--u)*7)/1 var(--display); margin: 0; color: var(--gold); text-wrap: balance; }
.cards { display: flex; flex-direction: column; gap: calc(var(--u)*3); width: 100%; }
.card { display: grid; grid-template-columns: auto 1fr; gap: calc(var(--u)*1) calc(var(--u)*3.5); align-items: center; text-align: left;
  width: 100%; padding: calc(var(--u)*3.6) calc(var(--u)*4); border-radius: calc(var(--u)*3.5); border: 2px solid var(--c); background: rgba(255,255,255,.06);
  color: var(--ink); cursor: pointer; font-family: var(--body); box-shadow: 0 calc(var(--u)*1) 0 rgba(0,0,0,.35); transition: transform .12s, background .12s; }
.card:hover { background: rgba(255,255,255,.12); transform: translateY(-2px); }
.card .ico { grid-row: span 2; width: calc(var(--u)*11); height: calc(var(--u)*11); border-radius: 50%; background: var(--c); display: grid; place-items: center;
  font: calc(var(--u)*5)/1 var(--display); color: #1b1230; }
.card .nm { font: 800 calc(var(--u)*4.4)/1.1 var(--body); display: flex; justify-content: space-between; gap: 1em; }
.card .nm small { font-size: .62em; font-weight: 600; color: var(--gold); white-space: nowrap; }
.card .ds { font: 400 calc(var(--u)*3.1)/1.35 var(--body); color: var(--muted); }
.big { font: calc(var(--u)*11)/1 var(--display); color: var(--coral); }
.stats { display: flex; gap: calc(var(--u)*6); }
.stats div { display: flex; flex-direction: column; gap: calc(var(--u)*1); }
.stats b { font: calc(var(--u)*8)/1 var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
.stats span { font: 600 calc(var(--u)*2.6)/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.err { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ink); font: 400 15px/1.5 var(--body); }
@media (prefers-reduced-motion: reduce) { .hint { animation: none; } }
</style>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"

</script>
<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

// ======================================================================
// Tuning (same numbers as the Unity prototype)
// ======================================================================
const LANE_HALF = 0.9, PIN_HEAD = 12, LANE_END = 14.4;
const HOOK_ACCEL = 1.3, MIN_SPEED = 6.5, MAX_SPEED = 12, START_LIVES = 3;
const DT = 1 / 120;
const G_STATIC = 1, G_BALL = 2, G_PIN = 4, G_OBST = 8;
// Lane runs along -Z (distance d maps to z = -d) so screen-right is +X.

const UPGRADES = [
  { id: 'heavy',   name: 'Heavy Ball',     desc: '+40% ball weight. Plows through pins.',   max: 3, color: '#8fa6d9', ico: 'H' },
  { id: 'big',     name: 'Big Ball',       desc: '+18% ball size. Harder to miss.',          max: 3, color: '#5fd4ff', ico: 'B' },
  { id: 'power',   name: 'Power Throw',    desc: '+15% throw speed.',                        max: 3, color: '#ff9f3c', ico: 'P' },
  { id: 'golden',  name: 'Golden Pins',    desc: '+1 point for every pin.',                  max: 5, color: '#ffc93c', ico: '$' },
  { id: 'strikem', name: 'Strike Master',  desc: '+5 bonus points per Strike.',              max: 5, color: '#ff6b6b', ico: 'X' },
  { id: 'extra',   name: 'Extra Ball',     desc: '+1 ball every stage.',                     max: 2, color: '#63f0a0', ico: '+' },
  { id: 'explode', name: 'Explosive Pins', desc: 'Falling pins explode and knock neighbours.', max: 3, color: '#ff7a2f', ico: '!' },
  { id: 'split',   name: 'Split Ball',     desc: 'Ball splits on the first hit.',            max: 2, color: '#f27ae0', ico: 'Y' },
  { id: 'shock',   name: 'Shockwave',      desc: 'First hit releases a blast.',              max: 3, color: '#3ee6e0', ico: 'O' },
  { id: 'magnet',  name: 'Magnet Ball',    desc: 'Ball steers toward standing pins.',        max: 3, color: '#a98bff', ico: 'U' },
  { id: 'combo',   name: 'Combo',          desc: 'Strikes in a row: +50% points each.',      max: 3, color: '#ff5d9e', ico: 'C' },
  { id: 'heart',   name: 'Extra Heart',    desc: '+1 heart.',                                max: 5, color: '#ff5d7a', ico: '♥' },
];

class Run {
  constructor() { this.stage = 1; this.lives = START_LIVES; this.streak = 0; this.total = 0; this.lv = {}; }
  L(id) { return this.lv[id] || 0; }
  add(id) { this.lv[id] = this.L(id) + 1; if (id === 'heart') this.lives++; }
  get ballMass() { return 7 * (1 + 0.4 * this.L('heavy')); }
  get ballR() { return 0.18 * (1 + 0.18 * this.L('big')); }
  get speedMul() { return 1 + 0.15 * this.L('power'); }
  get pinValue() { return 1 + this.L('golden'); }
  get strikeBonus() { return 5 + 5 * this.L('strikem'); }
  get spareBonus() { return 3; }
  get rolls() { return 2 + this.L('extra'); }
  get comboPer() { return 0.5 * this.L('combo'); }
}

// ======================================================================
// Pin layouts: [x, depth behind head pin]
// ======================================================================
const rows = (counts, s) => { const o = []; counts.forEach((n, r) => { for (let i = 0; i < n; i++) o.push([(i - (n - 1) / 2) * s, r * s * 0.866]); }); return o; };
const triangle = (n, s) => rows(Array.from({ length: n }, (_, i) => i + 1), s);
const twin = () => { const o = []; for (const sd of [-1, 1]) o.push([0.55 * sd, 0], [0.35 * sd, 0.35], [0.75 * sd, 0.35], [0.55 * sd, 0.7]); return o; };
const scatter = n => { const o = []; for (let t = 0; t < 500 && o.length < n; t++) { const p = [rand(-0.7, 0.7), rand(0, 1.6)]; if (o.every(q => (p[0]-q[0])**2 + (p[1]-q[1])**2 > 0.33*0.33)) o.push(p); } return o; };
function layoutFor(stage, boss) {
  if (boss) return triangle(5, 0.42);
  if (stage <= 2) return triangle(4, 0.5);
  return [() => triangle(4, 0.5), () => rows([1,2,3,2,1], 0.48), () => rows([5,4], 0.4), twin, () => scatter(10)][Math.floor(Math.random() * 5)]();
}
function rand(a, b) { return a + Math.random() * (b - a); }

// ======================================================================
// DOM + renderer
// ======================================================================
const $ = id => document.getElementById(id);
const stageEl = $('stage'), canvas = $('game');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
} catch (e) {
  stageEl.innerHTML = '<div class="err">This game needs WebGL, which this browser has turned off.</div>';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#221a3d');
scene.fog = new THREE.Fog('#221a3d', 20, 36);
const camera = new THREE.PerspectiveCamera(52, 9 / 16, 0.05, 100);

scene.add(new THREE.HemisphereLight('#c9b8ff', '#3a2a55', 1.4));
const sun = new THREE.DirectionalLight('#fff3e2', 2.2);
sun.position.set(3, 9, 1);
sun.target.position.set(0, 0, -8);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 12, bottom: -12, near: 1, far: 30 });
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);

function resize() {
  const availW = window.innerWidth - 32, availH = window.innerHeight - 20;
  let w = Math.min(availW, availH * 0.62);
  let h = Math.min(availH, w * 2.17);
  if (h < w * 1.4) w = h / 1.4;
  stageEl.style.width = w + 'px';
  stageEl.style.height = h + 'px';
  stageEl.style.setProperty('--u', (w / 100) + 'px');
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 0.5 ? 58 : 52;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const matCache = new Map();
function mat(color, opts = {}) {
  const key = color + JSON.stringify(opts);
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.05, flatShading: true, ...opts }));
  return matCache.get(key);
}

// ======================================================================
// Physics world
// ======================================================================
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;
world.solver.iterations = 12;
const mLane = new CANNON.Material('lane'), mBall = new CANNON.Material('ball'), mPin = new CANNON.Material('pin');
world.addContactMaterial(new CANNON.ContactMaterial(mBall, mLane, { friction: 0.06, restitution: 0.05 }));
world.addContactMaterial(new CANNON.ContactMaterial(mPin, mLane, { friction: 0.35, restitution: 0.15 }));
world.addContactMaterial(new CANNON.ContactMaterial(mBall, mPin, { friction: 0.1, restitution: 0.4 }));
world.addContactMaterial(new CANNON.ContactMaterial(mPin, mPin, { friction: 0.25, restitution: 0.45 }));
world.defaultContactMaterial.friction = 0.2;

function box(size, pos, color, { collide = true, material = null, shadow = true, parent = scene } = {}) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(...size), mat(color));
  mesh.position.set(...pos);
  mesh.castShadow = shadow; mesh.receiveShadow = true;
  parent.add(mesh);
  if (collide) {
    const body = new CANNON.Body({ mass: 0, material, collisionFilterGroup: G_STATIC });
    body.addShape(new CANNON.Box(new CANNON.Vec3(size[0] / 2, size[1] / 2, size[2] / 2)));
    body.position.set(...pos);
    world.addBody(body);
  }
  return mesh;
}

// ---------- Lane ----------
(function buildLane() {
  const len = LANE_END + 1.5, zc = (1.5 - LANE_END) / 2;
  box([LANE_HALF * 2, 0.2, len], [0, -0.1, zc], '#f0b872', { material: mLane, shadow: false });
  // board lines for a wood look
  for (let i = -3; i <= 3; i++) box([0.006, 0.002, len], [i * 0.26, 0.001, zc], '#d99a55', { collide: false, shadow: false });
  const deckStart = PIN_HEAD - 0.6;
  box([LANE_HALF * 2, 0.002, LANE_END - deckStart], [0, 0.0015, -(deckStart + LANE_END) / 2], '#fbd49a', { collide: false, shadow: false });
  box([LANE_HALF * 2, 0.002, 0.04], [0, 0.002, -0.15], '#7a4526', { collide: false, shadow: false });
  for (let i = -2; i <= 2; i++) {
    const a = box([0.1, 0.002, 0.1], [i * 0.3, 0.002, -(4.5 - Math.abs(i) * 0.35)], '#7a4526', { collide: false, shadow: false });
    a.rotation.y = Math.PI / 4;
  }
  for (const s of [-1, 1]) {
    box([0.3, 0.2, len], [s * (LANE_HALF + 0.15), -0.18, zc], '#3b2f5c', { material: mLane });
    box([0.12, 0.45, len], [s * (LANE_HALF + 0.36), 0.05, zc], '#ff5d7a');
    for (let d = 1; d < LANE_END; d += 3) {
      box([0.4, 1.6, 0.4], [s * 2.3, 0.3, -d], '#4b3a8a', { collide: false });
      const top = box([0.5, 0.2, 0.5], [s * 2.3, 1.2, -d], '#ffc93c', { collide: false });
      top.material = mat('#ffc93c', { emissive: '#ff9f3c', emissiveIntensity: 0.6 });
    }
  }
  box([3, 0.2, 2.5], [0, -1, -(LANE_END + 1.25)], '#2b2147');
  box([3, 2.4, 0.2], [0, 0, -(LANE_END + 2.5)], '#1c1533');
  const mask = box([2.9, 0.6, 0.2], [0, 1.45, -(LANE_END + 0.2)], '#5fd4ff', { collide: false });
  mask.material = mat('#5fd4ff', { emissive: '#2a8fd0', emissiveIntensity: 0.5 });
  box([12, 0.2, len + 14], [0, -1.25, zc], '#1d1636', { collide: false, shadow: false });
})();

// ---------- Pin visual (lathe profile, low-poly) ----------
const pinProfile = [[0,0],[0.06,0],[0.085,0.05],[0.105,0.16],[0.1,0.28],[0.07,0.4],[0.045,0.48],[0.05,0.55],[0.06,0.62],[0.05,0.68],[0.025,0.72],[0,0.73]]
  .map(([r, y]) => new THREE.Vector2(r, y));
const pinGeo = new THREE.LatheGeometry(pinProfile, 12);
const stripeGeo = new THREE.CylinderGeometry(0.053, 0.05, 0.035, 12);

// ======================================================================
// Audio (procedural, starts after the first tap)
// ======================================================================
const sfx = (() => {
  let ac = null, noise = null, lastHit = 0;
  function init() {
    if (ac) return;
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return; }
    noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function env(g, t, a, peak, dur) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
  function noiseHit(freq, type, vol, dur) {
    const t = ac.currentTime, src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noise; f.type = type; f.frequency.value = freq; env(g, t, 0.005, vol, dur);
    src.connect(f).connect(g).connect(ac.destination); src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
  }
  function tone(freq, type, vol, dur, delay = 0) {
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();

// ======================================================================
// Entities
// ======================================================================
let run = null;
const pins = [], balls = [], obstacles = [], fx = [];
let mainBall = null, layout = triangle(4, 0.5), heavyCount = 0;
let state = 'title', stateTimer = 0, bannerDur = 0, afterBanner = null;
let rollsLeft = 0, rollIndex = 0, stageScore = 0, target = 0, isBoss = false, strikeFx = false;
let timeScale = 1, slowUntil = 0, shake = 0, simTime = 0;
let best = 0; try { best = +localStorage.getItem('sd_best') || 0; } catch {}
const pending = [];

function makePin(x, depth, heavy) {
  const body = new CANNON.Body({ mass: heavy ? 5 : 1.5, material: mPin, linearDamping: 0.1, angularDamping: 0.3,
    allowSleep: true, sleepSpeedLimit: 0.15, sleepTimeLimit: 0.4, collisionFilterGroup: G_PIN });
  body.addShape(new CANNON.Cylinder(0.1, 0.1, 0.64, 10), new CANNON.Vec3(0, 0.08, 0));
  body.position.set(x, 0.243, -(PIN_HEAD + depth));
  world.addBody(body);
  body.sleep();
  const g = new THREE.Group();
  const m = new THREE.Mesh(pinGeo, mat(heavy ? '#3a3a52' : '#fffaf2'));
  m.position.y = -0.24; m.castShadow = true;
  const st = new THREE.Mesh(stripeGeo, mat(heavy ? '#ffc93c' : '#ff3d5a'));
  st.position.y = 0.52 - 0.24; st.castShadow = false;
  g.add(m, st);
  scene.add(g);

  body.userData = { pin };
  body.addEventListener('collide', e => { const v = Math.abs(e.contact.getImpactVelocityAlongNormal()); if (v > 1.2) sfx.hit(v); });

}
function removePin(p) { world.removeBody(p.body); scene.remove(p.mesh); }

function makeBall(pos, r, mass, clone) {
  const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 2), mat(clone ? '#f27ae0' : '#38b6ff', { roughness: 0.25 }));
  mesh.castShadow = true;
  mesh.position.copy(pos);

}
function launchBall(ball, vel, hook) {
  const body = new CANNON.Body({ mass: ball.mass, material: mBall, linearDamping: 0.02, angularDamping: 0.05,
    collisionFilterGroup: G_BALL, collisionFilterMask: G_STATIC | G_PIN | G_OBST, allowSleep: false });
  body.addShape(new CANNON.Sphere(ball.r));
  body.position.set(ball.mesh.position.x, ball.mesh.position.y, ball.mesh.position.z);

}
function ballDone(b) {

  const p = b.body.position;

}
function clearBalls() { for (const b of balls) { if (b.body) world.removeBody(b.body); scene.remove(b.mesh); } balls.length = 0; mainBall = null; }

  body.addShape(new CANNON.Box(new CANNON.Vec3(0.225, 0.2, 0.15)));

// ---------- FX ----------
function burst(pos, color, size, dur = 0.35) {
  const m = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 1), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.7 }));
  m.position.copy(pos); m.scale.setScalar(0.05); scene.add(m);
  fx.push({ m, t: 0, update(dt) { this.t += dt; const k = this.t / dur; m.scale.setScalar(Math.max(0.01, size * Math.min(1, k / 0.35))); m.material.opacity = 0.7 * (1 - k); return k < 1; } });
}

    const s = rand(0.04, 0.08);
    const m = new THREE.Mesh(new THREE.BoxGeometry(s, s, s * 0.3), new THREE.MeshBasicMaterial({ color: CONFETTI[i % CONFETTI.length] }));
    m.position.copy(pos); scene.add(m);
    const v = new THREE.Vector3(rand(-2.5, 2.5), rand(3, 6.5), rand(-1, 2));
    const spin = new THREE.Vector3(rand(-12, 12), rand(-12, 12), rand(-12, 12));

// ======================================================================
// Stage flow
// ======================================================================
function spawnPins() {
  const heavy = new Set();
  while (heavy.size < Math.min(heavyCount, layout.length)) heavy.add(Math.floor(Math.random() * layout.length));
  layout.forEach(([x, d], i) => makePin(x, d, heavy.has(i)));

}
function clearStage() {
  for (const p of pins) removePin(p); pins.length = 0;

  clearBalls();
}

  mainBall = makeBall(new THREE.Vector3(0, r + 0.005, -0.6), r, run.ballMass, false);
}
function newRun() { run = new Run(); startStage(1); }
function startStage(s) {
  clearStage();
  run.stage = s;
  isBoss = s % 5 === 0;
  layout = layoutFor(s, isBoss);
  heavyCount = isBoss ? 3 : 0;
  spawnPins();
  let n = isBoss ? 1 : s >= 7 ? 2 : s >= 3 ? 1 : 0;
  if (s >= 10) n++;
  for (let i = 0; i < n; i++) makeObstacle(6.5 + i * 2.2, rand(1, 1.9), rand(0, 6.28));
  target = Math.round(layout.length * 0.7 + (s - 1) * 1.4) + (isBoss ? 3 : 0);
  stageScore = 0; rollIndex = 0; rollsLeft = run.rolls;
  resetBall();
  flash(isBoss ? 'BOSS STAGE!' : 'STAGE ' + s, isBoss ? '#ff5d7a' : '#fff7ec', 1.2);
  setState('aiming');
}

function allKnocked() { return pins.length > 0 && pins.every(p => p.knocked); }

function resolveRoll() {
  const knocked = pins.filter(p => p.knocked).length;
  const standing = pins.length - knocked;
  const strike = rollIndex === 0 && standing === 0 && knocked > 0;
  const spare = rollIndex > 0 && standing === 0 && knocked > 0;
  let mult = 1;
  if (strike) { run.streak++; mult = 1 + run.comboPer * (run.streak - 1); }
  else if (rollIndex === 0) run.streak = 0;
  const pts = Math.round(knocked * run.pinValue * mult);
  const bonus = strike ? run.strikeBonus : spare ? run.spareBonus : 0;
  stageScore += pts + bonus;

  if (strike) flash(mult > 1 ? 'STRIKE! x' + (+mult.toFixed(1)) : 'STRIKE!', '#ffc93c', 1.1);
  else if (spare) flash('SPARE!', '#63f0a0', 1);
  else if (knocked === 0) flash('MISS', '#b9acd9', 0.8);
  if (pts + bonus > 0) popup('+' + (pts + bonus));

  for (let i = pins.length - 1; i >= 0; i--) if (pins[i].knocked) { removePin(pins[i]); pins.splice(i, 1); }
  rollIndex++; rollsLeft--;

  if (stageScore >= target) return endStage(true);
  if (rollsLeft <= 0) return endStage(false);
  if (pins.length === 0) { spawnPins(); rollIndex = 0; flash('RE-RACK!', '#5fd4ff', 0.9); }
  resetBall();
  setState('aiming');
}

function endStage(cleared) {
  if (cleared) {
    run.total += stageScore;
    if (run.stage > best) { best = run.stage; try { localStorage.setItem('sd_best', best); } catch {} }
    confetti(new THREE.Vector3(0, 0.5, -PIN_HEAD), 25);
    banner('STAGE CLEAR!', '#63f0a0', 1.3, showUpgrades);
  } else {
    run.lives--; run.streak = 0; sfx.fail();
    if (run.lives <= 0) banner('OUT OF HEARTS', '#ff5d7a', 1.5, () => setState('over'));
    else banner('FAILED  -1 ♥', '#ff5d7a', 1.3, () => startStage(run.stage));
  }
}
function banner(text, color, dur, then) { flash(text, color, dur); bannerDur = dur; afterBanner = then; setState('banner'); }

function showUpgrades() {
  const pool = UPGRADES.filter(u => run.L(u.id) < u.max);
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const choices = pool.slice(0, 3);
  if (!choices.length) return startStage(run.stage + 1);
  const wrap = $('cards'); wrap.innerHTML = '';
  for (const u of choices) {
    const lv = run.L(u.id);
    const b = document.createElement('button');
    b.className = 'card'; b.style.setProperty('--c', u.color);
    b.innerHTML = `<span class="ico">${u.ico}</span><span class="nm">${u.name}<small>${lv ? 'Lv ' + lv + ' → ' + (lv + 1) : 'NEW'}</small></span><span class="ds">${u.desc}</span>`;
    b.addEventListener('click', () => { sfx.click(); run.add(u.id); startStage(run.stage + 1); });
    wrap.appendChild(b);
  }
  setState('upgrade');
}

// ======================================================================
// Events: pins knocked, first hit, explosions
// ======================================================================
function onPinKnocked(pin) {
  if (!run || (state !== 'rolling' && state !== 'settling')) return;
  const ex = run.L('explode');
  if (ex > 0) { const p = pin.body.position; explode(new THREE.Vector3(p.x, p.y + 0.2, p.z), 0.55 + 0.12 * ex, 2.5 + 1.5 * ex, '#ff8a2f'); }
  if (rollIndex === 0 && !strikeFx && allKnocked()) {
    strikeFx = true; timeScale = 0.35; slowUntil = performance.now() + 550; shake = Math.max(shake, 0.18);
    sfx.strike(); confetti(new THREE.Vector3(0, 0.6, -(PIN_HEAD + 0.6)), 40);
  }
}
function onFirstHit(ball) {
  shake = Math.max(shake, 0.06);
  const bp = ball.body.position, at = new THREE.Vector3(bp.x, bp.y, bp.z);
  const sw = run.L('shock');
  if (sw > 0) explode(at, 0.7 + 0.25 * sw, 3 + 2 * sw, '#3ee6e0');
  const sp = run.L('split');
  if (sp > 0 && !ball.clone) {
    const v = ball.body.velocity;
    for (let i = 0; i < sp; i++) {
      const sign = i % 2 === 0 ? 1 : -1, a = sign * (16 + 8 * Math.floor(i / 2)) * Math.PI / 180;
      const nv = { x: v.x * Math.cos(a) + v.z * Math.sin(a), z: -v.x * Math.sin(a) + v.z * Math.cos(a) };
      const nb = makeBall(at.clone().add(new THREE.Vector3(sign * ball.r * 2.1, 0, 0)), ball.r, run.ballMass * 0.7, true);
      launchBall(nb, { x: nv.x * 0.95, z: nv.z * 0.95 }, 0);

  }
}
function explode(pos, radius, force, color) {
  burst(pos, color, radius * 1.4); sfx.boom(); shake = Math.max(shake, 0.12);
  for (const p of pins) {
    const bp = p.body.position;
    const dx = bp.x - pos.x, dy = bp.y - pos.y, dz = bp.z - pos.z, dist = Math.hypot(dx, dy, dz);
    if (dist > radius) continue;
    const k = force * (1 - dist / radius) / Math.max(dist, 0.05);

function nearestPinX(from) {

    const bp = p.body.position;

    const s = Math.abs(bp.x - from.x) + (-bp.z + from.z) * 0.2;
    if (s < best) { best = s; x = bp.x; }

// ======================================================================
// Physics step
// ======================================================================
const UP = new CANNON.Vec3(0, 1, 0), tmpUp = new CANNON.Vec3();
function physicsStep() {
  simTime += DT;
  for (const o of obstacles) {
    o.body.velocity.x = Math.cos(simTime * o.speed + o.phase) * 0.62 * o.speed;
  }
  for (const b of balls) {
    if (!b.launched) continue;
    b.time += DT;
    const p = b.body.position;
    const onLane = Math.abs(p.x) < LANE_HALF && p.y > -0.05;
    if (!onLane || -p.z > PIN_HEAD - 0.3) continue;
    if (b.hook) b.body.applyForce(new CANNON.Vec3(b.hook * HOOK_ACCEL * b.body.mass, 0, 0));
    const mag = run ? run.L('magnet') : 0;
    if (mag > 0 && -p.z > 3) {
      const tx = nearestPinX(p);
      if (tx !== null) b.body.applyForce(new CANNON.Vec3(Math.max(-1, Math.min(1, (tx - p.x) * 3)) * mag * 1.2 * b.body.mass, 0, 0));
    }
  }
  world.step(DT);
  while (pending.length) onFirstHit(pending.shift());
  for (const p of pins) {
    if (p.knocked) continue;
    p.body.quaternion.vmult(UP, tmpUp);
    const bp = p.body.position;
    if (tmpUp.y < Math.cos(28 * Math.PI / 180) || bp.y < -0.15 || Math.abs(bp.x) > LANE_HALF + 0.02 || -bp.z > LANE_END) {
      p.knocked = true; onPinKnocked(p);

// ======================================================================
// Input: drag sideways to place, swipe up to throw, curve to hook
// ======================================================================
let pressing = false, locked = false, pressStart = null, swipeStart = null, swipeT = 0, ballX0 = 0;
const samples = [];
const aimArrow = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.01, 1.4), new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.8 }));
aimArrow.visible = false; scene.add(aimArrow);

function pt(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, w: r.width, h: r.height }; }
canvas.addEventListener('pointerdown', e => {
  sfx.init();
  if (state !== 'aiming' || !mainBall) return;
  canvas.setPointerCapture(e.pointerId);
  pressing = true; locked = false; pressStart = pt(e); ballX0 = mainBall.mesh.position.x; samples.length = 0;
});
canvas.addEventListener('pointermove', e => {
  if (!pressing || state !== 'aiming') return;
  const p = pt(e);
  if (!locked) {
    if (pressStart.y - p.y > p.h * 0.025) { locked = true; swipeStart = p; swipeT = performance.now(); samples.length = 0; samples.push(p); }
    else {
      const r = mainBall.r;
      mainBall.mesh.position.x = Math.max(-LANE_HALF + r, Math.min(LANE_HALF - r, ballX0 + (p.x - pressStart.x) / p.w * 3));
    }
  } else {
    samples.push(p);
    const tx = p.x - swipeStart.x, ty = swipeStart.y - p.y;
    if (ty > p.h * 0.02) {
      const aim = Math.max(-0.28, Math.min(0.28, tx / ty * 0.5));
      const dir = new THREE.Vector3(aim, 0, -1).normalize();
      aimArrow.visible = true;
      aimArrow.position.set(mainBall.mesh.position.x + dir.x, 0.01, mainBall.mesh.position.z + dir.z);
      aimArrow.rotation.y = Math.atan2(dir.x, dir.z);
    }
  }
});
function release(e) {
  if (!pressing) return;
  pressing = false; aimArrow.visible = false;
  if (!locked || state !== 'aiming' || samples.length < 2) return;
  const end = samples[samples.length - 1];
  const tx = end.x - swipeStart.x, ty = swipeStart.y - end.y;
  if (ty < end.h * 0.06) return;
  const dur = Math.max((performance.now() - swipeT) / 1000, 0.04);
  const aim = Math.max(-0.28, Math.min(0.28, tx / ty * 0.5));
  const swipeSpeed = Math.hypot(tx, ty) / end.h / dur;
  const k = Math.max(0, Math.min(1, (swipeSpeed - 0.6) / 2.9));
  const speed = (MIN_SPEED + (MAX_SPEED - MIN_SPEED) * k) * run.speedMul;
  // hook from the swipe's bow: bowing right ")" hooks left, bowing left "(" hooks right
  const len = Math.hypot(tx, ty); let bestC = 0;
  if (len > 1) {
    const ux = tx / len, uy = ty / len;
    for (const s of samples) { const ax = s.x - swipeStart.x, ay = swipeStart.y - s.y; const c = ux * ay - uy * ax; if (Math.abs(c) > Math.abs(bestC)) bestC = c; }
  }
  let hook = bestC / Math.max(len, 1) * 5; if (Math.abs(hook) < 0.12) hook = 0; hook = Math.max(-1, Math.min(1, hook));

  launchBall(mainBall, { x: dir.x, z: dir.z }, hook);
  sfx.roll();
  setState('rolling');
}
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

}

// ======================================================================
// Main loop
// ======================================================================
const camPos = new THREE.Vector3(0, 2.1, 2.4), camLook = new THREE.Vector3(0, 0, -7.5);
const CAM_BASE = new THREE.Vector3(0, 2.1, 2.4);
let last = performance.now(), acc = 0;

function syncMeshes() {
  for (const p of pins) { p.mesh.position.copy(p.body.position); p.mesh.quaternion.copy(p.body.quaternion); }
  for (const b of balls) if (b.body) { b.mesh.position.copy(b.body.position); b.mesh.quaternion.copy(b.body.quaternion); }
  for (const o of obstacles) o.mesh.position.copy(o.body.position);
}

function updateCamera(rdt) {
  const tPos = CAM_BASE.clone(), tLook = new THREE.Vector3(0, 0, -7.5);
  if ((state === 'rolling' || state === 'settling') && mainBall) {
    const maxD = PIN_HEAD - 3.5, bp = mainBall.mesh.position;
    const bd = Math.max(0, Math.min(maxD, -bp.z));
    tPos.add(new THREE.Vector3(Math.max(-LANE_HALF, Math.min(LANE_HALF, bp.x)) * 0.3, -0.4 * bd / maxD, -bd));
    tLook.set(0, 0, -Math.min(bd + 7.5, PIN_HEAD + 0.5));
  } else if (state === 'title') {
    const t = performance.now() / 1000;
    tPos.set(Math.sin(t * 0.3) * 0.6, 1.6, -4);
    tLook.set(0, 0.2, -PIN_HEAD);
  }
  const k = 1 - Math.exp(-5 * rdt);
  camPos.lerp(tPos, k); camLook.lerp(tLook, k);
  shake = Math.max(0, shake - rdt * 0.5);
  camera.position.copy(camPos);
  if (shake > 0) camera.position.add(new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).multiplyScalar(shake));
  camera.lookAt(camLook);
}

function frame(now) {
  const rdt = Math.min(0.05, (now - last) / 1000); last = now;
  if (slowUntil && now > slowUntil) { timeScale = 1; slowUntil = 0; }
  acc += rdt * timeScale;
  let n = 0;
  while (acc >= DT && n < 10) { physicsStep(); acc -= DT; n++; }
  if (n === 10) acc = 0;
  const dt = rdt * timeScale;

  if (state === 'rolling') {
    if (balls.length && balls.every(ballDone)) setState('settling');
  } else if (state === 'settling') {
    stateTimer += dt;
    if (stateTimer > (allKnocked() ? 0.7 : 1.4)) resolveRoll();
  } else if (state === 'banner') {
    stateTimer += rdt;
    if (stateTimer > bannerDur) { const a = afterBanner; afterBanner = null; a && a(); }
  }

  syncMeshes();
  for (let i = fx.length - 1; i >= 0; i--) if (!fx[i].update(rdt)) { scene.remove(fx[i].m); fx[i].m.geometry.dispose(); fx.splice(i, 1); }
  updateCamera(rdt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

spawnPins();
syncMeshes();
setState('title');
requestAnimationFrame(frame);
</script>
