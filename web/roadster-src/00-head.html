<title>Roadster Survive</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: a phone-shaped game screen on an asphalt backdrop. HUD floats over the 3D road;
   the garage is a bottom sheet under a live 3D car showcase. */
:root {
  --backdrop: #1b2130;
  --ink: #ffffff;
  --ink-dark: #18202f;
  --muted: #c3cee2;
  --panel: rgba(15, 21, 35, 0.78);
  --panel-solid: #172033;
  --line: rgba(255, 255, 255, 0.16);
  --go: #2bd96b;
  --stop: #ff3b4d;
  --cash: #ffc21a;
  --blue: #2e9bff;
  --violet: #8b5cf6;
  --display: "Russo One", "Arial Black", Impact, sans-serif;
  --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: repeating-linear-gradient(90deg, transparent 0 47%, rgba(255,255,255,.05) 47% 53%, transparent 53% 100%), var(--backdrop);
  background-color: var(--backdrop); color: var(--ink); font-family: var(--body);
  display: grid; place-items: center; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box; overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#stage { position: relative; overflow: hidden; border-radius: 22px; background: #9ad8ff; --u: 4px; touch-action: none;
  box-shadow: 0 0 0 3px #39445c, 0 30px 80px rgba(0,0,0,.5); }
canvas#game { display: block; width: 100%; height: 100%; }
svg { display: block; }

/* ---------- HUD ---------- */
.hud { position: absolute; inset: 0 0 auto 0; padding: calc(var(--u)*3) calc(var(--u)*3) 0; pointer-events: none; display: flex; flex-direction: column; gap: calc(var(--u)*1.6); }
.row { display: flex; align-items: center; gap: calc(var(--u)*2); }
.chip { display: inline-flex; align-items: center; gap: calc(var(--u)*1.2); font: calc(var(--u)*3.6)/1 var(--display); padding: calc(var(--u)*1.5) calc(var(--u)*2.4);
  border-radius: 99px; background: var(--panel); border: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip svg { width: calc(var(--u)*4.4); height: calc(var(--u)*4.4); }
.chip.cash { color: var(--cash); }
.chip.power { margin-left: auto; padding: calc(var(--u)*1.2) calc(var(--u)*3) calc(var(--u)*1.2) calc(var(--u)*1.6); background: linear-gradient(180deg, #3aa3ff, #1f6fe0); border-color: rgba(255,255,255,.45); }
.chip.power small { font: 600 calc(var(--u)*2.2)/1 var(--body); letter-spacing: .1em; opacity: .85; }
.chip.power b { font: calc(var(--u)*5.4)/1 var(--display); font-weight: 400; }
.chip.power.bump { animation: bump .35s ease-out; }
@keyframes bump { 40% { transform: scale(1.18); } }
.prog { flex: 1; height: calc(var(--u)*3.2); border-radius: 99px; background: var(--panel); position: relative; border: 2px solid rgba(255,255,255,.25); }
.prog i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit; background: linear-gradient(90deg, #2e9bff, #2bd96b); }
.prog .car { position: absolute; top: 50%; width: calc(var(--u)*3.4); height: calc(var(--u)*3.4); border-radius: 50%; background: #fff; border: 2px solid var(--blue); transform: translate(-50%, -50%); }
.prog .boss { position: absolute; right: calc(var(--u)*-1); top: 50%; transform: translateY(-50%); width: calc(var(--u)*5.4); height: calc(var(--u)*5.4); }
.hearts { display: flex; gap: calc(var(--u)*.6); }
.hearts svg { width: calc(var(--u)*5.2); height: calc(var(--u)*5.2); filter: drop-shadow(0 2px 0 rgba(0,0,0,.25)); }
.effects { display: flex; flex-wrap: wrap; gap: calc(var(--u)*1.2); }
.fx { display: inline-flex; align-items: center; gap: calc(var(--u)*1); font: 800 calc(var(--u)*2.7)/1 var(--body); padding: calc(var(--u)*1.1) calc(var(--u)*1.8) calc(var(--u)*1.1) calc(var(--u)*1.1);
  border-radius: 99px; background: var(--panel); border: 2px solid var(--c, #fff); }
.fx svg { width: calc(var(--u)*3.6); height: calc(var(--u)*3.6); }

.gadgets { position: absolute; right: calc(var(--u)*2.4); top: 30%; display: flex; flex-direction: column; gap: calc(var(--u)*2); z-index: 3; }
.gbtn { position: relative; width: calc(var(--u)*13); height: calc(var(--u)*13); border-radius: calc(var(--u)*3.5); border: 2px solid var(--c); background: var(--panel);
  display: grid; place-items: center; cursor: pointer; padding: 0; box-shadow: 0 calc(var(--u)*1) 0 rgba(0,0,0,.35); }
.gbtn svg { width: 66%; height: 66%; }
.gbtn b { position: absolute; right: calc(var(--u)*-1.2); top: calc(var(--u)*-1.2); min-width: calc(var(--u)*4.6); height: calc(var(--u)*4.6); border-radius: 99px; background: var(--c); color: var(--ink-dark);
  font: calc(var(--u)*2.8)/calc(var(--u)*4.6) var(--display); text-align: center; }
.gbtn:disabled { opacity: .45; cursor: default; }
.gbtn:active:not(:disabled) { transform: translateY(2px); }
.gbtn.passive { cursor: default; width: calc(var(--u)*10); height: calc(var(--u)*10); margin-left: auto; }

.charge { position: absolute; left: 30%; right: 30%; bottom: 5%; height: calc(var(--u)*2.6); border-radius: 99px; background: var(--panel); border: 2px solid rgba(255,255,255,.3); overflow: hidden; }
.charge i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #ff4d8d, #ffd1e4); }
.charge.ready i { background: #fff; }

.tut { position: absolute; left: 0; right: 0; top: 54%; display: flex; flex-direction: column; align-items: center; gap: calc(var(--u)*2.4); pointer-events: none; text-align: center; transition: opacity .4s; }
.tut.off { opacity: 0; }
.tut svg { width: calc(var(--u)*30); height: calc(var(--u)*30); filter: drop-shadow(0 4px 10px rgba(0,0,0,.4)); }
.tut .t { font: calc(var(--u)*5)/1.1 var(--display); text-shadow: 0 3px 0 rgba(0,0,0,.35); }
.tut .s { font: 800 calc(var(--u)*3.2)/1.35 var(--body); padding: calc(var(--u)*1.6) calc(var(--u)*3); border-radius: 99px; background: var(--panel); }
.tut .finger { animation: fing 2.4s ease-in-out infinite; transform-origin: center; }
@keyframes fing { 0%,100% { transform: translate(0,0); } 20% { transform: translate(14px,0); } 40% { transform: translate(-14px,0); } 60% { transform: translate(0,-14px); } 80% { transform: translate(0,14px); } }

.hint { position: absolute; left: calc(var(--u)*5); right: calc(var(--u)*17); top: 13.5%; text-align: center; font: 800 calc(var(--u)*3.6)/1.2 var(--body);
  padding: calc(var(--u)*1.5) calc(var(--u)*2.8); border-radius: calc(var(--u)*2.4); background: rgba(15, 21, 35, 0.62); border: 1px solid var(--line); pointer-events: none; opacity: 0; transform: translateY(-8px); transition: opacity .25s, transform .25s; text-wrap: balance; }
.hint.on { opacity: 1; transform: none; }
.hint .g { color: var(--go); } .hint .r { color: var(--stop); } .hint .y { color: var(--cash); } .hint .b { color: #7cc4ff; }
.flash { position: absolute; left: 0; right: 0; top: 38%; text-align: center; font: calc(var(--u)*10.5)/1 var(--display); pointer-events: none; opacity: 0;
  text-shadow: 0 calc(var(--u)*.8) 0 rgba(0,0,0,.35), 0 0 calc(var(--u)*4) rgba(0,0,0,.25); -webkit-text-stroke: 1px rgba(0,0,0,.25); }
.flash.go { animation: flash var(--d, 1.2s) ease-out forwards; }
@keyframes flash { 0% { opacity: 0; transform: scale(1.8); } 12% { opacity: 1; transform: scale(1); } 78% { opacity: 1; } 100% { opacity: 0; transform: translateY(calc(var(--u)*-3)); } }
.redflash { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 calc(var(--u)*14) rgba(255,40,60,.9); opacity: 0; }
.redflash.go { animation: rf .5s ease-out; }
@keyframes rf { 0% { opacity: 1; } 100% { opacity: 0; } }
.speedlines { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s;
  background: repeating-linear-gradient(90deg, transparent 0 9%, rgba(255,255,255,.55) 9% 9.4%, transparent 9.4% 23%, rgba(255,255,255,.35) 23% 23.3%, transparent 23.3% 100%);
  -webkit-mask: radial-gradient(ellipse 45% 55% at 50% 55%, transparent 55%, #000 100%); mask: radial-gradient(ellipse 45% 55% at 50% 55%, transparent 55%, #000 100%); animation: lines .25s linear infinite; }
.speedlines.on { opacity: 1; }
@keyframes lines { to { background-position: 0 calc(var(--u)*30); } }
.edge { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s; box-shadow: inset 0 0 calc(var(--u)*10) var(--c, #38bdf8); }
.edge.on { opacity: .9; }

/* ---------- Panels ---------- */
.panel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u)*3);
  padding: calc(var(--u)*6) calc(var(--u)*5); text-align: center; box-sizing: border-box; }
.panel.dim { background: linear-gradient(rgba(12,18,32,.2), rgba(12,18,32,.88) 60%); }
.tag { font: 800 calc(var(--u)*3.6)/1.3 var(--body); }
.tag b { color: var(--go); } .tag i { font-style: normal; color: var(--cash); }
.small { font: 400 calc(var(--u)*3)/1.5 var(--body); color: var(--muted); max-width: 34ch; }
.btn { font: calc(var(--u)*5.4)/1 var(--display); color: var(--ink); background: var(--go); border: 0; border-radius: calc(var(--u)*3.5);
  padding: calc(var(--u)*3.6) calc(var(--u)*9); box-shadow: 0 calc(var(--u)*1.3) 0 #16924a; cursor: pointer; transition: transform .1s, box-shadow .1s; text-shadow: 0 2px 0 rgba(0,0,0,.2); }
.btn:active { transform: translateY(calc(var(--u)*1)); box-shadow: 0 calc(var(--u)*.3) 0 #16924a; }
.btn.alt { background: var(--cash); color: var(--ink-dark); box-shadow: 0 calc(var(--u)*1.3) 0 #b88200; font-size: calc(var(--u)*4); padding: calc(var(--u)*2.8) calc(var(--u)*6); text-shadow: none; }
.btn:disabled { filter: grayscale(.7); opacity: .7; }
button:focus-visible { outline: 3px solid var(--cash); outline-offset: 3px; }
.panel h2 { margin: 0; font: calc(var(--u)*8)/1 var(--display); text-wrap: balance; font-weight: 400; }
.panel h2.win { color: var(--go); } .panel h2.lose { color: var(--stop); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u)*2.4); width: 100%; }
.stats div { background: var(--panel); border: 1px solid var(--line); border-radius: calc(var(--u)*3); padding: calc(var(--u)*3); display: flex; flex-direction: column; gap: calc(var(--u)*1.2); }
.stats b { font: calc(var(--u)*7)/1 var(--display); font-weight: 400; font-variant-numeric: tabular-nums; }
.stats span { font: 600 calc(var(--u)*2.5)/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.stats .c b { color: var(--cash); }
.found { display: flex; gap: calc(var(--u)*1.6); flex-wrap: wrap; justify-content: center; }

/* ---------- Garage / shop ---------- */
.garage { justify-content: flex-start; padding: 0; gap: 0; background: linear-gradient(rgba(12,18,32,.0) 30%, rgba(12,18,32,.25) 45%); }
.ghead { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: calc(var(--u)*3.5) calc(var(--u)*4); box-sizing: border-box; }
.ghead h2 { font: calc(var(--u)*6.4)/1 var(--display); text-shadow: 0 3px 0 rgba(0,0,0,.3); }
.showcase { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: calc(var(--u)*2); pointer-events: none; }
.showcase .nm { font: calc(var(--u)*5)/1 var(--display); text-shadow: 0 3px 0 rgba(0,0,0,.35); }
.showcase .sub { font: 600 calc(var(--u)*2.8)/1.3 var(--body); margin-top: calc(var(--u)*1); padding: calc(var(--u)*1) calc(var(--u)*2.4); border-radius: 99px; background: var(--panel); }
.sheet { width: 100%; height: 56%; background: var(--panel-solid); border-radius: calc(var(--u)*5) calc(var(--u)*5) 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.35);
  display: flex; flex-direction: column; box-sizing: border-box; padding: calc(var(--u)*2.6) calc(var(--u)*3.4) calc(var(--u)*3.4); gap: calc(var(--u)*2.4); }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: calc(var(--u)*1.2); background: rgba(0,0,0,.25); padding: calc(var(--u)*1); border-radius: calc(var(--u)*3); }
.tab { border: 0; background: transparent; color: var(--muted); font: calc(var(--u)*3)/1 var(--display); padding: calc(var(--u)*2.2) 0; border-radius: calc(var(--u)*2.2); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: calc(var(--u)*1); }
.tab svg { width: calc(var(--u)*5.4); height: calc(var(--u)*5.4); opacity: .7; }
.tab[aria-selected="true"] { background: #2a3550; color: var(--ink); }
.tab[aria-selected="true"] svg { opacity: 1; }
.items { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: calc(var(--u)*1.8); padding-right: 2px; scrollbar-width: thin; }
.item { display: grid; grid-template-columns: calc(var(--u)*13) 1fr auto; gap: calc(var(--u)*2.6); align-items: center; padding: calc(var(--u)*2.2); border-radius: calc(var(--u)*3);
  background: #202b43; border: 2px solid transparent; text-align: left; color: var(--ink); font-family: var(--body); cursor: pointer; width: 100%; box-sizing: border-box; }
.item.sel { border-color: var(--blue); background: #22324f; }
.item .ic { width: calc(var(--u)*13); height: calc(var(--u)*13); border-radius: calc(var(--u)*3); background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.18), rgba(255,255,255,.04)); display: grid; place-items: center; }
.item .ic svg { width: 82%; height: 82%; }
.item .mid { min-width: 0; display: flex; flex-direction: column; gap: calc(var(--u)*.9); }
.item .nm { font: calc(var(--u)*3.6)/1.1 var(--display); display: flex; gap: calc(var(--u)*1.4); align-items: baseline; flex-wrap: wrap; }
.item .nm small { font: 600 calc(var(--u)*2.4)/1 var(--body); color: var(--muted); }
.item .ds { font: 400 calc(var(--u)*2.6)/1.3 var(--body); color: var(--muted); }
.bars { display: grid; grid-template-columns: auto 1fr; gap: calc(var(--u)*.6) calc(var(--u)*1.6); align-items: center; font: 600 calc(var(--u)*2.1)/1 var(--body); color: var(--muted); letter-spacing: .06em; margin-top: calc(var(--u)*.4); }
.bars span { display: flex; gap: 2px; }
.bars i { flex: 1; height: calc(var(--u)*1.4); border-radius: 2px; background: rgba(255,255,255,.12); }
.bars i.on { background: var(--c, var(--cash)); }
.pips { display: flex; gap: 2px; margin-top: calc(var(--u)*.4); flex-wrap: wrap; }
.pips i { width: calc(var(--u)*2.2); height: calc(var(--u)*1.4); border-radius: 2px; background: rgba(255,255,255,.12); }
.pips i.on { background: var(--go); }
.buy { font: calc(var(--u)*3.2)/1 var(--display); border: 0; border-radius: calc(var(--u)*2.2); padding: calc(var(--u)*2.2) calc(var(--u)*2.6); background: var(--cash); color: var(--ink-dark);
  box-shadow: 0 calc(var(--u)*.8) 0 #b88200; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: calc(var(--u)*.8); font-variant-numeric: tabular-nums; }
.buy svg { width: calc(var(--u)*3.4); height: calc(var(--u)*3.4); }
.buy.equip { background: var(--blue); color: #fff; box-shadow: 0 calc(var(--u)*.8) 0 #1a5fb8; }
.buy.on { background: transparent; color: var(--go); box-shadow: none; border: 2px solid var(--go); }
.buy:disabled { background: #3a465f; color: #8d9ab3; box-shadow: none; cursor: default; }
.buy.max { background: transparent; color: var(--muted); box-shadow: none; border: 2px solid var(--line); }
.sheet .btn { width: 100%; padding: calc(var(--u)*3.4) 0; }
.foot { display: flex; justify-content: center; }
.linkbtn { background: none; border: 0; color: var(--muted); font: 400 calc(var(--u)*2.4)/1 var(--body); text-decoration: underline; cursor: pointer; padding: calc(var(--u)*.6); }
.err { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ink-dark); font: 400 15px/1.5 var(--body); }

/* ---------- AutoPilot banner ---------- */
.apbar { position: absolute; left: calc(var(--u)*3); right: calc(var(--u)*3); bottom: calc(var(--u)*12); display: flex; align-items: center; gap: calc(var(--u)*2.4);
  padding: calc(var(--u)*2) calc(var(--u)*2.4); border-radius: calc(var(--u)*4); background: linear-gradient(90deg, rgba(76,29,149,.92), rgba(109,40,217,.85)); border: 2px solid #c4b5fd;
  box-shadow: 0 0 calc(var(--u)*6) rgba(167,139,250,.6); z-index: 4; }
.apbar.nudge { animation: nudge .35s; }
@keyframes nudge { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.apwheel { width: calc(var(--u)*11); height: calc(var(--u)*11); flex: none; animation: steerwheel 1.6s ease-in-out infinite; }
.apwheel svg { width: 100%; height: 100%; }
@keyframes steerwheel { 0%,100% { transform: rotate(-35deg); } 50% { transform: rotate(35deg); } }
.aptext { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: calc(var(--u)*.8); }
.aptext b { font: calc(var(--u)*4.4)/1 var(--display); font-weight: 400; letter-spacing: .04em; }
.aptext span { font: 600 calc(var(--u)*2.6)/1.2 var(--body); color: #ddd6fe; }
.aptrack { height: calc(var(--u)*1.6); border-radius: 99px; background: rgba(0,0,0,.35); overflow: hidden; }
.aptrack i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #c4b5fd, #fff); }
.apbar button { flex: none; font: calc(var(--u)*2.8)/1 var(--display); color: #4c1d95; background: #fff; border: 0; border-radius: calc(var(--u)*2.4); padding: calc(var(--u)*2.2) calc(var(--u)*2.4); cursor: pointer; }

/* ---------- 3D thumbnails, slots, toggles ---------- */
.item .ic img, .slot img { width: 100%; height: 100%; object-fit: contain; display: block; }
.gbtn img { width: 92%; height: 92%; object-fit: contain; }
.slotbar { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u)*1.6); padding: calc(var(--u)*2); border-radius: calc(var(--u)*3); background: rgba(0,0,0,.25); }
.slotbar .cap { grid-column: 1 / -1; font: 600 calc(var(--u)*2.4)/1 var(--body); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.slot { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u)*.6); padding: calc(var(--u)*1.2); border-radius: calc(var(--u)*2.4); background: #202b43; border: 2px solid var(--blue); min-width: 0; }
.slot .p { width: calc(var(--u)*12); height: calc(var(--u)*12); }
.slot b { font: calc(var(--u)*2.4)/1.1 var(--display); font-weight: 400; text-align: center; overflow-wrap: anywhere; }
.slot.empty { border-style: dashed; border-color: var(--line); color: var(--muted); justify-content: center; font: 600 calc(var(--u)*2.3)/1.25 var(--body); text-align: center; }
.slot.locked { border-color: transparent; background: rgba(255,255,255,.04); color: #7d8aa5; justify-content: center; font: 600 calc(var(--u)*2.3)/1.25 var(--body); text-align: center; }
.toggles { display: flex; gap: calc(var(--u)*1.6); }
.tg { width: calc(var(--u)*9); height: calc(var(--u)*9); border-radius: 50%; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; cursor: pointer; padding: 0; }
.tg svg { width: 60%; height: 60%; }
.titletg { position: absolute; top: calc(var(--u)*4); right: calc(var(--u)*4); }

/* ---------- v4: icon-first title, garage grid, settings ---------- */
.panel.title { background: linear-gradient(rgba(12,18,32,.55), rgba(12,18,32,0) 30%, rgba(12,18,32,0) 60%, rgba(12,18,32,.75)); justify-content: flex-start; padding-top: calc(var(--u)*12); }
.grow { flex: 1; }
.btn.play { font-size: calc(var(--u)*8); padding: calc(var(--u)*4.4) calc(var(--u)*14); display: inline-flex; align-items: center; gap: calc(var(--u)*2.4); border-radius: calc(var(--u)*5); }
.tri { width: 0; height: 0; border-left: calc(var(--u)*5) solid #fff; border-top: calc(var(--u)*3.2) solid transparent; border-bottom: calc(var(--u)*3.2) solid transparent; }
.trow { display: flex; gap: calc(var(--u)*3); justify-content: center; margin-bottom: calc(var(--u)*6); }
.iconbtn { width: calc(var(--u)*13); height: calc(var(--u)*13); border-radius: calc(var(--u)*3.6); border: 0; background: #fff; box-shadow: 0 calc(var(--u)*1) 0 #9aa3b2; display: grid; place-items: center; cursor: pointer; padding: 0; }
.iconbtn svg { width: 62%; height: 62%; }
.iconbtn.sm { width: calc(var(--u)*9); height: calc(var(--u)*9); }
.chip.big { font-size: calc(var(--u)*4.6); padding: calc(var(--u)*2) calc(var(--u)*3); }
